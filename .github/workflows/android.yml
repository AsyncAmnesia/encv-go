name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (defaults to current branch)'
        required: false
        default: ''
        type: string
      version:
        description: 'Version number (e.g. 1.0.0). When set, builds release APK.'
        required: false
        default: ''
        type: string
      skip_plugin:
        description: 'Skip all plugin builds (MPV + OpenList). Only build host app.'
        required: false
        default: 'false'
        type: boolean

env:
  NDK_VERSION: "26.1.10909125"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: app/encv-mobile/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}

      - name: Install Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: yes | sdkmanager --install "ndk;${{ env.NDK_VERSION }}" > /dev/null 2>&1 && echo "✅ NDK installed"

      - name: Install Android platform & build tools
        run: yes | sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 && echo "✅ Platform & build tools installed"

      - name: Cache pnpm dependencies (main)
        id: cache-pnpm
        uses: actions/cache@v4
        with:
          path: |
            app/encv-mobile/node_modules
            app/encv-mobile/packages/components/node_modules
            app/encv-mobile/plugin-openlist/web/node_modules
          key: pnpm-main-${{ hashFiles('app/encv-mobile/pnpm-lock.yaml', 'app/encv-mobile/packages/**/package.json', 'app/encv-mobile/plugin-openlist/web/package.json') }}
          restore-keys: |
            pnpm-main-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/encv-mobile/android/*.gradle', 'app/encv-mobile/android/app/*.gradle', 'app/encv-mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Cache ffmpeg/x264 build (intermediates)
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: app/encv-mobile/scripts/.ffmpeg-build
          key: ffmpeg-build-${{ hashFiles('app/encv-mobile/scripts/build-ffmpeg-android.sh') }}
          restore-keys: |
            ffmpeg-build-

      # Note: jniLibs output cache removed — it can be polluted by plugin .so files from previous builds.
      # The ffmpeg build intermediates cache above is sufficient; rebuilding .so output takes <5s.

      - name: Install frontend dependencies
        run: cd app/encv-mobile && pnpm install --frozen-lockfile

      - name: TypeScript check (main app)
        working-directory: app/encv-mobile
        run: pnpm exec vue-tsc --noEmit

      - name: TypeScript check (plugin-openlist/web)
        working-directory: app/encv-mobile/plugin-openlist/web
        run: pnpm exec vue-tsc --noEmit

      - name: Build main app web
        working-directory: app/encv-mobile
        run: pnpm run build

      - name: Build plugin-openlist/web → assets/openlist/
        working-directory: app/encv-mobile
        run: bash scripts/build-plugin-openlist-web.sh

      - name: Run frontend unit tests (vitest)
        run: |
          cd app/encv-mobile
          echo "═══ Frontend Unit Tests ═══"
          pnpm exec vitest run --reporter=verbose 2>&1 | tail -30
          echo ""
          echo "═══ Frontend Test Summary ═══"

      - name: Download MPV native libraries from Release
        if: inputs.skip_plugin != true
        run: |
          cd app/encv-mobile/plugin-mpv-player/src/main
          mkdir -p jniLibs/arm64-v8a
          ASSET_URL=$(curl -sf \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/mpv-native-libs" \
            | jq -r '.assets[] | select(.name | startswith("mpv-jniLibs-arm64")) | .browser_download_url')
          if [ -z "$ASSET_URL" ]; then
            echo "::error::No MPV lib asset found in release 'mpv-native-libs'. Run 'Build MPV Native Libraries' workflow first."
            exit 1
          fi
          echo "Downloading: $ASSET_URL"
          curl -fSL -o /tmp/mpv-jniLibs.zip "$ASSET_URL"
          unzip -o /tmp/mpv-jniLibs.zip -d jniLibs/
          echo "✅ MPV libs extracted:"
          ls -lhR jniLibs/

      - name: Build ffmpeg shared libraries for Android
        run: cd app/encv-mobile && bash scripts/build-ffmpeg-android.sh

      - name: Upload FFmpeg build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-logs
          path: app/encv-mobile/scripts/.ffmpeg-build/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Run Go unit tests
        run: |
          # Phase 18 Guard D: gofmt -l on touched Go files (CI fail-fast on style)
          UNFORMATTED=$(gofmt -l ./internal ./cmd 2>/dev/null || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::❌ gofmt check FAILED. Run \`gofmt -w <files>\` on:"
            echo "$UNFORMATTED" | while read f; do echo "  - $f"; done
            exit 1
          fi
          echo "✅ gofmt: all Go files properly formatted"

          echo "═══ Go Unit Tests (service layer) ═══"
          go test ./internal/service/ -count=1 -timeout 120s -v 2>&1 | tail -30
          echo ""
          echo "═══ Go Unit Tests (video plugin) ═══"
          go test ./internal/v2/plugins/video/ -count=1 -timeout 120s -v 2>&1 | tail -30
          echo ""
          echo "═══ ComboLite Static Check ═══"
          go test ./internal/service/ -count=1 -timeout 60s -run TestComboLite -v 2>&1 | tail -20
          echo ""
          echo "═══ Go Test Summary ═══"
          go test ./internal/service/ ./internal/v2/plugins/video/ -count=1 -timeout 120s 2>&1 | tail -5

      - name: Build Go binary for Android arm64 (with CGO for ffmpeg dlopen)
        env:
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: arm64
          CC: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: |
          go build \
            -ldflags="-s -w -X main.version=${{ inputs.version || 'dev' }}" \
            -o app/encv-mobile/encv-go-arm64 \
            ./cmd/encv-mobile
          echo "Go binary size:"
          ls -lh app/encv-mobile/encv-go-arm64

      # Keystore stored outside android/app to avoid accidental commit
      - name: Restore release keystore from cache
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: app/encv-mobile/keystore
          key: encv-release-keystore

      - name: Ensure release keystore exists
        run: |
          KEYSTORE="app/encv-mobile/keystore/release.jks"
          if [ -f "$KEYSTORE" ]; then
            echo "Keystore ready:"
            ls -lh "$KEYSTORE"
          else
            echo "Creating new release keystore..."
            mkdir -p app/encv-mobile/keystore
            keytool -genkeypair -v -keystore "$KEYSTORE" \
              -storepass encv2025 -alias encvrelease \
              -keypass encv2025 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ENCV-go, OU=Personal, O=ENCV, L=Unknown, ST=Unknown, C=CN"
            echo "Keystore created:"
            ls -lh "$KEYSTORE"
          fi

      # android/ is in git — cap copy copies web assets (dist/ → assets/public/). Required for BOTH debug and release because we use gradlew directly instead of npx cap build
      - name: Copy web assets to Android project
        run: |
          cd app/encv-mobile
          npx cap copy android
          echo "Android project ready:"
          ls -la android/*.gradle android/app/*.gradle

      # === Non-Gradle customizations ===
      # Phase 18 Guard A (from .trae/rules/verification-discipline.md §7.7):
      # Validate every libs.X.Y reference in build.gradle.kts has a corresponding
      # alias in libs.versions.toml. Catches Phase 16 bug class
      # (Unresolved reference 'foundation' polluting the entire multi-project).
      # Runs BEFORE R8 guard because toml mismatch blocks the whole config phase.
      - name: "Pre-build: Gradle version catalog alias guard"
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║   Gradle Version Catalog Alias Guard (v1)       ║"
          echo "║   Catches: libs.X.Y w/o toml alias (Phase 16)   ║"
          echo "╚══════════════════════════════════════════════════╝"
          echo ""

          cd app/encv-mobile
          TOML="android/gradle/libs.versions.toml"
          if [ ! -f "$TOML" ]; then
            echo "::error::libs.versions.toml not found at $TOML"
            exit 1
          fi

          # Extract toml aliases (strip hyphen, Gradle maps '-' to '.' in accessor)
          TOML_LIBS=$(awk '/\[libraries\]/{flag=1; next} /^\[/{flag=0} flag && /^[a-zA-Z]/' "$TOML" \
                      | sed -E 's/^([a-zA-Z0-9._-]+).*/\1/' | sort -u)
          TOML_PLUGINS=$(awk '/\[plugins\]/{flag=1; next} /^\[/{flag=0} flag && /^[a-zA-Z]/' "$TOML" \
                         | sed -E 's/^([a-zA-Z0-9._-]+).*/\1/' | sort -u)

          FAIL=0
          TOTAL=0
          # Search ALL build.gradle.kts under app/encv-mobile/ (incl. plugin-*/ siblings of android/)
          for f in $(find . -name "build.gradle.kts" -not -path "*/build/*" -type f | sort); do
            REFS=$(grep -oE 'libs\.(plugins|[a-zA-Z0-9._-]+)\.[a-zA-Z0-9._-]+' "$f" 2>/dev/null | sort -u)
            for ref in $REFS; do
              [[ "$ref" == libs.versions.* ]] && continue
              TOTAL=$((TOTAL + 1))
              if [[ "$ref" == libs.plugins.* ]]; then
                alias="${ref#libs.plugins.}"; alias="${alias//./-}"
                if ! echo "$TOML_PLUGINS" | grep -qx "$alias"; then
                  echo "  ✗ $f: $ref ❌ PLUGIN '$alias' not in toml"
                  FAIL=$((FAIL + 1))
                fi
              else
                alias="${ref#libs.}"; alias="${alias//./-}"
                if ! echo "$TOML_LIBS" | grep -qx "$alias"; then
                  echo "  ✗ $f: $ref ❌ LIB '$alias' not in toml"
                  FAIL=$((FAIL + 1))
                fi
              fi
            done
          done

          echo ""
          echo "────────────────────────────────────"
          echo "Total libs.* references checked: $TOTAL"
          echo "Failures: $FAIL"
          echo "────────────────────────────────────"
          if [ "$FAIL" -gt 0 ]; then
            echo "::error::❌ TOML alias guard FAILED: $FAIL unresolved libs.* references"
            echo "::error::Each libs.X.Y accessor must have an alias 'x-y' (dash) in [libraries] or [plugins] of libs.versions.toml"
            exit 1
          fi
          echo "✅ TOML alias guard PASSED: all $TOTAL libs.* references resolvable"

      - name: Check R8/ProGuard is disabled for ALL build variants
        run: |
          set +e  # Don't let sub-command failures kill the script before we print diagnostics
          exec 2>&1  # Merge stderr into stdout so everything shows in one stream

          echo "╔══════════════════════════════════════════════════╗"
          echo "║     R8 / ProGuard Obfuscation Guard (v2)        ║"
          echo "╚══════════════════════════════════════════════════╝"
          echo ""

          VIOLATIONS=0
          WARNINGS=0
          FILES_CHECKED=0
          FILES_SKIPPED=0

          # Phase 1: List ALL .gradle.kts files found
          echo "📋 Phase 1: Scanning for *.gradle.kts files..."
          echo "   Search path: app/encv-mobile/android"
          echo "   Exclude pattern: */build/*"
          echo ""
          ALL_FILES=$(find app/encv-mobile/android -name "*.gradle.kts" -not -path "*/build/*" -type f | sort)
          FILE_COUNT=$(echo "$ALL_FILES" | grep -c .)

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No .gradle.kts files found! Search path may be wrong."
            echo "   This means the guard cannot check anything."
            exit 1
          fi

          echo "   Found $FILE_COUNT file(s):"
          while IFS= read -r line || [ -n "$line" ]; do
            echo "     ✦ $line"
          done < <(echo "$ALL_FILES")
          echo ""

          # Phase 2: Check each file (use process substitution to avoid subshell variable loss)
          echo "🔍 Phase 2: Checking each file..."
          echo ""

          while IFS= read -r f || [ -n "$f" ]; do
            FILES_CHECKED=$((FILES_CHECKED + 1))
            BASENAME=$(basename "$f")
            RELPATH=${f#app/encv-mobile/android/}
            echo "--- [$FILES_CHECKED/$FILE_COUNT] $RELPATH ---"

            # Check 1: isMinifyEnabled = true → FATAL
            MINIFY_MATCH=$(grep -n 'isMinifyEnabled\s*=\s*true' "$f" 2>/dev/null)
            if [ -n "$MINIFY_MATCH" ]; then
              echo "   ❌ FATAL: isMinifyEnabled = true found:"
              echo "$MINIFY_MATCH" | while read line; do echo "      $line"; done
              echo "::error file=$f,line=$(echo "$MINIFY_MATCH" | head -1 | cut -d: -f1)::R8 minification ENABLED (isMinifyEnabled=true) — ComboLite incompatible!"
              VIOLATIONS=$((VIOLATIONS + 1))
            else
              echo "   ✅ isMinifyEnabled ≠ true (OK)"
            fi

            # Check 2: isShrinkResources = true → FATAL (AGP hard-coupling with minifyEnabled)
            SHRINK_MATCH=$(grep -n 'isShrinkResources\s*=\s*true' "$f" 2>/dev/null)
            if [ -n "$SHRINK_MATCH" ]; then
              echo "   ❌ FATAL: isShrinkResources = true found:"
              echo "$SHRINK_MATCH" | while read line; do echo "      $line"; done
              echo "::error file=$f,line=$(echo "$SHRINK_MATCH" | head -1 | cut -d: -f1)::Resource shrinking ENABLED — AGP requires isMinifyEnabled=true (ComboLite incompatible)!"
              VIOLATIONS=$((VIOLATIONS + 1))
            else
              echo "   isShrinkResources ≠ true (not set)"
            fi

            # Check 3: legacy minifyEnabled = true → FATAL
            LEGACY_MATCH=$(grep -n 'minifyEnabled\s*=\s*true' "$f" 2>/dev/null)
            if [ -n "$LEGACY_MATCH" ]; then
              echo "   ❌ FATAL: Legacy minifyEnabled=true found:"
              echo "$LEGACY_MATCH" | while read line; do echo "      $line"; done
              echo "::error file=$f,line=$(echo "$LEGACY_MATCH" | head -1 | cut -d: -f1)::Legacy R8 minification enabled (minifyEnabled=true)"
              VIOLATIONS=$((VIOLATIONS + 1))
            else
              echo "   Legacy minifyEnabled ≠ true (OK)"
            fi

            # Bonus: Show actual values if buildTypes block exists
            ACTUAL_MINIFY=$(grep 'isMinifyEnabled' "$f" 2>/dev/null | head -1)
            ACTUAL_SHRINK=$(grep 'isShrinkResources' "$f" 2>/dev/null | head -1)
            if [ -n "$ACTUAL_MINIFY" ] || [ -n "$ACTUAL_SHRINK" ]; then
              echo "   📝 Actual config:"
              [ -n "$ACTUAL_MINIFY" ] && echo "      $ACTUAL_MINIFY"
              [ -n "$ACTUAL_SHRINK" ] && echo "      $ACTUAL_SHRINK"
            fi
            echo ""
          done < <(echo "$ALL_FILES")

          # Phase 3: Verdict
          echo "╔══════════════════════════════════════════════════╗"
          echo "║           GUARD VERDICT                        ║"
          echo "╠══════════════════════════════════════════════════╣"
          echo "║ Files scanned : $FILE_COUNT                        ║"
          echo "║ Violations    : $VIOLATIONS (FATAL → blocks build)    ║"
          echo "║ Warnings      : $WARNINGS (info only)                ║"
          echo "╚══════════════════════════════════════════════════╝"
          echo ""

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "::error::❌ GUARD FAILED: $VIOLATIONS R8/ProGuard violation(s) detected."
            echo ""
            echo "WHAT THIS MEANS:"
            echo "  ComboLite framework uses kotlin-reflect (::function.javaMethod)"
            echo "  for @RequiresPermission permission checks. R8 obfuscation breaks"
            echo "  @Metadata ↔ bytecode consistency, causing runtime crashes."
            echo ""
            echo "HOW TO FIX:"
            echo "  Set isMinifyEnabled=false AND isShrinkResources=false in ALL buildTypes."
            echo "  AGP hard-couples these two: shrinkResources requires minifyEnabled=true."
            echo "  See: .trae/rules/combolite.md §1.3 + .trae/rules/android.md §3.1"
            echo ""

            # Write detailed report to summary
            echo "## ❌ R8/ProGuard Guard FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Files scanned | $FILE_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| Fatal violations | \`$VIOLATIONS\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Warnings | \`$WARNINGS\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Root cause | R8 breaks kotlin-reflect @Metadata consistency |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Fix:** Set \`isMinifyEnabled=false\`. See [.trae/rules/combolite.md](.trae/rules/combolite.md#13)" >> $GITHUB_STEP_SUMMARY

            exit 1
          else
            echo "✅ GUARD PASSED: No R8/ProGuard obfuscation found."
            if [ "$WARNINGS" -gt 0 ]; then
              echo "⚠️  $WARNINGS resource shrink warning(s) above (safe with ComboLite)."
            fi
            echo ""

            echo "## ✅ R8/ProGuard Guard PASSED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Files scanned | $FILE_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| Violations | 0 |" >> $GITHUB_STEP_SUMMARY
            if [ "$WARNINGS" -gt 0 ]; then
              echo "| Warnings | $WARNINGS (resource shrink, safe) |" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Copy Go binary to jniLibs
        run: |
          mkdir -p app/encv-mobile/android/app/src/main/jniLibs/arm64-v8a
          cp app/encv-mobile/encv-go-arm64 app/encv-mobile/android/app/src/main/jniLibs/arm64-v8a/libencv-go.so
          echo "=== Host jniLibs BEFORE build ==="
          ls -lhR app/encv-mobile/android/app/src/main/jniLibs/



      - name: Verify native libraries
        run: |
          echo "═══ HOST APP jniLibs (Go backend only) ═══"
          HOST_LIBS="app/encv-mobile/android/app/src/main/jniLibs/arm64-v8a"
          for lib in libencv-go.so libffmpeg.so libffprobe.so; do
            if [ -f "$HOST_LIBS/$lib" ]; then
              echo "  ✅ $lib $(ls -lh "$HOST_LIBS/$lib" | awk '{print $5}')"
            else
              echo "  ⚠️ $lib absent"
            fi
          done

          echo ""
          echo "═══ MPV PLAYER PLUGIN jniLibs ═══"
          PLUGIN_LIBS="app/encv-mobile/plugin-mpv-player/src/main/jniLibs/arm64-v8a"
          if [ -d "$PLUGIN_LIBS" ]; then
            ls -lh "$PLUGIN_LIBS/"*.so 2>/dev/null | awk '{print "  ✅ "$NF" ("$5")"}'
            for lib in libmpv.so libplayer.so libavcodec.so libavformat.so libavutil.so; do
              [ -f "$PLUGIN_LIBS/$lib" ] && echo "  ✅ $lib present" || echo "  ❌ $lib MISSING!"
            done
          else
            echo "  ⚠️ Plugin jniLibs dir not found"
          fi

          echo ""
          echo "═══ EXPECTED SEPARATION ═══"
          echo "  Host APK: Go backend only (no MPV .so)"
          echo "  Plugin APK: All MPV/FFmpeg .so files"


      # === Build Plugins (structurally isolated from main app) ===
      # Plugin subprojects are conditionally included via -PincludePlugins=true
      # (see android/settings.gradle.kts).  Without the flag, Gradle's task
      # graph does NOT resolve :plugin-openlist:compile* or :plugin-mpv-player:*,
      # so a plugin Kotlin compile error can NEVER block the main app APK.
      #
      # Each plugin step runs its own gradlew invocation with -PincludePlugins=true.
      # Two layers of isolation:
      #   1. settings.gradle.kts conditional include — Gradle task graph never
      #      pulls :plugin-openlist:* into the main app's assemble* task.
      #   2. continue-on-error on each step — if a plugin build fails for its
      #      own reasons (Kotlin compile error, missing AAR, etc.), the step
      #      still shows FAILED (red, real error) but does NOT kill the job
      #      before the main app APK is built and uploaded.

      - name: Build MPV player plugin (JNI + Kotlin)
        if: inputs.skip_plugin != true
        continue-on-error: true
        run: |
          cd app/encv-mobile/android

          # Ensure libplayer.so is built
          if [ ! -f "plugin-mpv-player/src/main/jniLibs/arm64-v8a/libplayer.so" ]; then
            echo "Building libplayer.so via ndk-build..."
            bash ../scripts/build-player-so.sh || echo "⚠️ libplayer.so build failed"
          fi

          # Compile plugin Kotlin code (debug or release)
          BUILD_TYPE="${{ inputs.version && 'Release' || 'Debug' }}"
          ./gradlew -PincludePlugins=true ":plugin-mpv-player:compile${BUILD_TYPE}Kotlin" --stacktrace 2>&1 || true
          echo "=== Plugin compile done (${BUILD_TYPE}) ==="

      - name: Package MPV plugin as APK
        if: inputs.skip_plugin != true
        continue-on-error: true
        run: |
          cd app/encv-mobile/android
          BUILD_TYPE="${{ inputs.version && 'release' || 'debug' }}"

          ./gradlew -PincludePlugins=true "convert_plugin-mpv-player_${BUILD_TYPE}" --stacktrace

          PLUGIN_APK=$(find build -name "plugin-mpv-player-${BUILD_TYPE}.apk" -type f 2>/dev/null | head -1)
          if [ -n "$PLUGIN_APK" ] && [ -f "$PLUGIN_APK" ]; then
            echo "✅ Plugin APK generated:"
            ls -lh "$PLUGIN_APK"
            echo "📁 Plugin will be loaded from disk at runtime (filesDir/plugins/)"
          else
            echo "::error::Plugin APK not found after successful build"
            find build/outputs -name "*.apk" 2>/dev/null | head -5 || echo "No APKs found"
            exit 1
          fi

      - name: Verify plugin APK contents
        if: always() && inputs.skip_plugin != true
        continue-on-error: true
        run: |
          BUILD_TYPE="${{ inputs.version && 'release' || 'debug' }}"
          PLUGIN_APK=$(find app/encv-mobile/android/build -name "plugin-mpv-player-${BUILD_TYPE}.apk" -type f 2>/dev/null | head -1)
          if [ -f "$PLUGIN_APK" ]; then
            echo "=== Plugin APK size ==="
            ls -lh "$PLUGIN_APK"
            echo "=== .so files in plugin APK ==="
            unzip -l "$PLUGIN_APK" | grep "\.so" | head -20 || echo "(no .so)"
            echo "=== Total .so count ==="
            unzip -l "$PLUGIN_APK" | grep -c "\.so" || echo "0"
          else
            echo "⏭️ Plugin APK not available"
          fi

      # === Build OpenList Plugin (AAR → APK via aar2apk) ===
      # Phase 18 Cache A: cache the gomobile bind output by fork commit hash.
      # gomobile bind takes 3-5 min; if neither the fork commit nor the build
      # script changed, reuse the cached openlist.aar + openlist-classes.jar.
      - name: Restore OpenList AAR from cache
        id: cache-openlist-aar
        uses: actions/cache@v4
        with:
          path: |
            app/encv-mobile/plugin-openlist/libs/openlist.aar
            app/encv-mobile/plugin-openlist/libs/openlist-classes.jar
          key: openlist-aar-${{ hashFiles('scripts/build-openlist-aar.sh', 'app/encv-mobile/plugin-openlist/build.gradle.kts') }}-v2
          restore-keys: |
            openlist-aar-

      - name: Build OpenList AAR (gomobile bind)
        if: inputs.skip_plugin != true && steps.cache-openlist-aar.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          echo "═══ OpenList AAR Build (gomobile bind) ═══"
          bash scripts/build-openlist-aar.sh \
            --output app/encv-mobile/plugin-openlist/libs \
            --ndk /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }} \
            --frontend-version v4.1.8
          echo ""
          echo "=== AAR output ==="
          ls -lh app/encv-mobile/plugin-openlist/libs/openlist.aar*
          echo "=== AAR contents (spot check) ==="
          unzip -l app/encv-mobile/plugin-openlist/libs/openlist.aar | grep -E "libgojni|Openlistlib|\.so" || echo "(no matches)"

      - name: Extract OpenList AAR for plugin packaging
        if: inputs.skip_plugin != true
        continue-on-error: true
        run: |
          AAR="app/encv-mobile/plugin-openlist/libs/openlist.aar"
          PLUGIN_SRC="app/encv-mobile/plugin-openlist/src/main"
          echo "=== Extracting openlist.aar for plugin packaging ==="
          TMPDIR=$(mktemp -d)
          unzip -o "$AAR" -d "$TMPDIR"
          echo "AAR top-level contents:"
          ls -la "$TMPDIR/"
          # Copy JNI libs (libgojni.so) so AGP bundles them into the plugin AAR,
          # which aar2apk then packages into the final plugin APK.
          if [ -d "$TMPDIR/jni" ]; then
            rm -rf "$PLUGIN_SRC/jniLibs"
            mkdir -p "$PLUGIN_SRC/jniLibs"
            cp -r "$TMPDIR/jni/"* "$PLUGIN_SRC/jniLibs/"
            echo "JNI libs copied:"
            find "$PLUGIN_SRC/jniLibs" -name "*.so" -exec ls -lh {} \;
          else
            echo "::error::No jni/ directory in openlist.aar"
            exit 1
          fi
          # Copy classes.jar (gomobile bindings) so AGP bundles it into the
          # plugin AAR — regular .jar deps are bundled, unlike .aar deps.
          if [ -f "$TMPDIR/classes.jar" ]; then
            cp "$TMPDIR/classes.jar" app/encv-mobile/plugin-openlist/libs/openlist-classes.jar
            echo "classes.jar copied:"
            ls -lh app/encv-mobile/plugin-openlist/libs/openlist-classes.jar
          else
            echo "::error::No classes.jar in openlist.aar"
            exit 1
          fi
          rm -rf "$TMPDIR"
          echo "=== Extraction complete ==="

      - name: Build OpenList plugin APK (aar2apk)
        if: inputs.skip_plugin != true
        continue-on-error: true
        run: |
          # Phase 18 Guard C (cheapest, fail-fast): grep for known-bad Map<String, Any?>
          # property accesses. snapshot() returns a Map, so snapshot.running etc. is
          # always wrong (Phase 17 bug class). Grep is sub-second; catches the bug
          # BEFORE we even invoke gradle (which would take ~3 min to fail).
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  Map<String,Any?> property-guard (Phase 17)     ║"
          echo "╚══════════════════════════════════════════════════╝"
          GUARD_C_FAIL=0
          while IFS= read -r f; do
            for prop in running port pid dataSizeBytes lastError lastUpdateTs; do
              # Match snapshot.<prop>, exclude lines inside comments
              match=$(grep -nE "(^|[^A-Za-z_])\bsnapshot\.${prop}\b" "$f" 2>/dev/null \
                      | grep -vE ":\s*(//|\*)" || true)
              if [ -n "$match" ]; then
                echo "  ✗ $f: snapshot.${prop} is a Map<String,Any?> — use snapshot[\"${prop}\"]"
                echo "$match" | sed 's/^/      /'
                GUARD_C_FAIL=$((GUARD_C_FAIL + 1))
              fi
            done
          done < <(find app/encv-mobile/plugin-openlist/src -name "*.kt" 2>/dev/null)
          if [ "$GUARD_C_FAIL" -gt 0 ]; then
            echo "::error::❌ Map property guard FAILED: $GUARD_C_FAIL bad access(es)"
            echo "::error::snapshot() returns Map<String,Any?>. Use snapshot[\"key\"] instead of snapshot.key"
            exit 1
          fi
          echo "✅ Map property guard PASSED"

          # Phase 18 Guard B (kotlinc pre-flight): compile plugin Kotlin against
          # openlist-classes.jar (real gomobile stubs) to catch Unresolved
          # reference errors (Phase 17 bug class) BEFORE gradle's compileKotlin.
          # The gradle compileKotlin task itself takes ~3 min; this guard fails
          # in ~10s by going straight through kotlinc with classpath.
          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  kotlinc pre-flight (Phase 17 Unresolved guard) ║"
          echo "╚══════════════════════════════════════════════════╝"
          CLASSES_JAR="app/encv-mobile/plugin-openlist/libs/openlist-classes.jar"
          if [ ! -f "$CLASSES_JAR" ]; then
            echo "⏭️  openlist-classes.jar not present — kotlinc pre-flight SKIPPED"
            echo "    (jar is produced by 'Build OpenList AAR' + 'Extract OpenList AAR' steps)"
            echo "    (guard will fall through to gradle build, which catches unresolved references too — just slower)"
            echo "    Expected path: $CLASSES_JAR"
            ls -la "$CLASSES_JAR" 2>&1 || true
            echo ""
          else
            # Download kotlin-compiler-embeddable + stdlib + reflect + coroutines
            # via setup-kotlinc.sh (Maven Central, ~66MB, cached separately).
            # `|| true` shields from `set -e` killing the step on setup failure.
            bash .trae/scripts/setup-kotlinc.sh > /tmp/setup-kotlinc.log 2>&1 || true
            SETUP_EXIT=$?
            if [ $SETUP_EXIT -ne 0 ]; then
              echo "::warning::setup-kotlinc.sh failed (exit=$SETUP_EXIT). Last 30 lines of setup log:"
              tail -30 /tmp/setup-kotlinc.log
              echo "⚠️  Skipping kotlinc pre-flight (will rely on gradle build to catch errors)."
              echo ""
            else
              KOTLINC=$(which kotlinc-2.3.21 2>/dev/null || echo "/usr/local/bin/kotlinc-2.3.21")
              # Build classpath: openlist classes + android.jar + combolite-core
              ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name "android.jar" 2>/dev/null | head -1)
              COMBOLITE_JAR=$(find ~/.gradle/caches -name "combolite-core-2.0.2*.jar" 2>/dev/null | grep -v sources | head -1)
              CP="${CLASSES_JAR}"
              [ -n "$ANDROID_JAR" ] && CP="${CP}:${ANDROID_JAR}"
              [ -n "$COMBOLITE_JAR" ] && CP="${CP}:${COMBOLITE_JAR}"
              echo "  kotlinc: $KOTLINC"
              echo "  classpath: ${CP//:/, }"

              cd app/encv-mobile/plugin-openlist
              # NOTE: `|| true` is REQUIRED because the step's shell is
              # `bash -e` (set -e from `shell: /usr/bin/bash -e {0}` header).
              # Without it, kotlinc's non-zero exit would terminate the entire
              # step BEFORE PREFLIGHT_EXIT=$? runs, hiding the actual error
              # (Phase 19 finding: CI log showed "Process completed with exit
              # code 1" with NO "❌ kotlinc pre-flight FAILED" message).
              "$KOTLINC" -cp "$CP" -no-stdlib -no-reflect -Xsuppress-version-warnings \
                src/main/java/com/encvgo/plugin/openlist/*.kt \
                -d /tmp/encv-preflight-out 2>/tmp/encv-preflight.log || true
              PREFLIGHT_EXIT=$?
              cd -

              echo "  kotlinc exit: $PREFLIGHT_EXIT"
              # Filtered list = "known Phase 17 bug class" (gomobile methods + Map<String,Any?> keys)
              REAL_ERRORS=$(grep -E "Unresolved reference '(forceDbSync|forceDBSync|setConfigData|setConfigLog|setConfigDebug|setConfigNoPrefix|setAdminPassword|init|start|shutdown|isRunning|getOutbound|running|port|pid|dataSizeBytes|lastError|lastUpdateTs)'" /tmp/encv-preflight.log || true)
              # ALL unresolved = everything not in expected-3rd-party whitelist
              ALL_UNRESOLVED=$(grep -E "Unresolved reference" /tmp/encv-preflight.log || true)
              # Whitelisted 3rd-party noise (expected: android.*, compose.*, koin.*, openlistlib.* stub not on classpath, etc.)
              # Note: each pattern needs `\..*` to match the full reference like 'android.widget.Toast', not just 'android' literal.
              NOISE=$(echo "$ALL_UNRESOLVED" | grep -E "Unresolved reference '(android\.|androidx\.|com\.combo\.|org\.jetbrains\.|com\.tencent\.|mm\.composer\.|kotlin\.|kotlinx\.|kotlinx\.coroutines\.|org\.koin\.|openlistlib\.|com\.encvgo\.)" || true)
              TRULY_NEW=$(comm -23 <(echo "$ALL_UNRESOLVED" | sort -u) <(echo "$NOISE" | sort -u))

              if [ "$PREFLIGHT_EXIT" -ne 0 ] || [ -n "$REAL_ERRORS" ] || [ -n "$TRULY_NEW" ]; then
                echo "❌ kotlinc pre-flight FAILED"
                if [ -n "$REAL_ERRORS" ]; then
                  echo "  --- Phase 17 bug class (gomobile/Map<String,Any?>) ---"
                  echo "$REAL_ERRORS" | head -20 | sed 's/^/    /'
                fi
                if [ -n "$TRULY_NEW" ]; then
                  echo "  --- Other unresolved (NOT in expected 3rd-party whitelist) ---"
                  echo "$TRULY_NEW" | head -20 | sed 's/^/    /'
                fi
                if [ -z "$REAL_ERRORS" ] && [ -z "$TRULY_NEW" ]; then
                  echo "  (no unresolved references, but kotlinc exit=$PREFLIGHT_EXIT)"
                  echo "  --- last 20 lines of kotlinc output ---"
                  tail -20 /tmp/encv-preflight.log | sed 's/^/    /'
                fi
                echo "::error::❌ kotlinc pre-flight failed. Full log: /tmp/encv-preflight.log (already shown above)"
                exit 1
              fi
              echo "✅ kotlinc pre-flight PASSED (0 unresolved after filter)"
            fi
          fi

          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  Gradle: compile + convert (real build)         ║"
          echo "╚══════════════════════════════════════════════════╝"
          cd app/encv-mobile/android
          BUILD_TYPE="${{ inputs.version && 'Release' || 'Debug' }}"
          APK_BUILD_TYPE="${{ inputs.version && 'release' || 'debug' }}"
          echo "=== Compiling OpenList plugin (${BUILD_TYPE}) ==="
          ./gradlew -PincludePlugins=true ":plugin-openlist:compile${BUILD_TYPE}Kotlin" --stacktrace 2>&1
          echo "=== Converting to plugin APK ==="
          ./gradlew -PincludePlugins=true "convert_plugin-openlist_${APK_BUILD_TYPE}" --stacktrace 2>&1
          echo "=== Locating output ==="
          OPENLIST_APK="build/outputs/plugin-apks/${APK_BUILD_TYPE}/plugin-openlist-${APK_BUILD_TYPE}.apk"
          if [ -f "$OPENLIST_APK" ]; then
            echo "✅ OpenList Plugin APK:"
            ls -lh "$OPENLIST_APK"
          else
            echo "::error::OpenList Plugin APK not found after build"
            find build/outputs -name "*.apk" 2>/dev/null | head -5 || echo "No APKs found"
            exit 1
          fi

      - name: Verify OpenList plugin APK has openlistlib classes (dex string scan)
        if: inputs.skip_plugin != true
        continue-on-error: true
        run: |
          # A3.4 强化验证：用 dexdump 字符串扫描 classes.dex 看 Lopenlistlib/* 类是否真在 dex
          # 旧版 grep -qi "openlistlib" 永远 false（dex 内的类不在 zip entry name 里）
          APK_PATH=$(find app/encv-mobile/android/build -name "plugin-openlist-*-release.apk" -o -name "plugin-openlist-*-debug.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ No plugin APK found at expected path"
            exit 0
          fi
          echo "=== APK: $APK_PATH ==="
          ls -lh "$APK_PATH"

          mkdir -p /tmp/apk-inspect && cd /tmp/apk-inspect
          rm -f classes.dex classes2.dex classes3.dex
          unzip -o "$APK_PATH" 'classes*.dex' >/dev/null 2>&1 || true
          ls -la classes*.dex 2>/dev/null

          echo
          echo "=== dexdump availability ==="
          DEXDUMP=""
          for p in /opt/android-sdk/build-tools/*/dexdump /usr/lib/android-sdk/build-tools/*/dexdump; do
            [ -x "$p" ] && DEXDUMP="$p" && break
          done
          if [ -z "$DEXDUMP" ]; then
            DEXDUMP=$(find / -name dexdump 2>/dev/null | head -1)
          fi
          echo "dexdump=$DEXDUMP"

          echo
          echo "=== openlistlib classes in dex (via strings) ==="
          for dex in classes*.dex; do
            [ -f "$dex" ] || continue
            echo "--- $dex ---"
            echo "  bytes: $(stat -c%s "$dex")"
            COUNT=$(strings "$dex" | grep -c "Lopenlistlib/" 2>/dev/null || echo 0)
            echo "  Lopenlistlib/ 字符串数量: $COUNT"
            if [ "$COUNT" -gt 0 ]; then
              strings "$dex" | grep "Lopenlistlib/" | sort -u | head -20
            fi
          done

          echo
          echo "=== openlistlib classes in dex (via dexdump classes) ==="
          if [ -n "$DEXDUMP" ] && [ -x "$DEXDUMP" ]; then
            for dex in classes*.dex; do
              [ -f "$dex" ] || continue
              echo "--- $dex ---"
              "$DEXDUMP" "$dex" 2>/dev/null | grep -i "openlistlib" | head -20 || true
            done
          else
            echo "⚠️ dexdump 不可用，仅 strings 扫描"
          fi

          echo
          echo "=== com.encvgo.plugin.openlist classes in dex (sanity check) ==="
          for dex in classes*.dex; do
            [ -f "$dex" ] || continue
            echo "--- $dex ---"
            strings "$dex" | grep -E "Lcom/encvgo/plugin/openlist/" | sort -u | head -30
          done

          echo
          echo "=== libgojni.so check (native lib) ==="
          unzip -l "$APK_PATH" | grep -E "lib/.*\.so" | head -10
          unzip -p "$APK_PATH" 'lib/arm64-v8a/libgojni.so' 2>/dev/null | wc -c | xargs -I {} echo "lib/arm64-v8a/libgojni.so bytes: {}"

      - name: Inspect plugin-openlist AAR classes.jar (intermediate artifact)
        if: inputs.skip_plugin != true
        continue-on-error: true
        run: |
          # A3.4: 看 aar 阶段 classes.jar 里有什么类
          # 这是 sourceSet 注入是否真把 openlistlib 合并到 module 自身 classes 的关键证据
          AAR_PATH=$(find app/encv-mobile/android/plugin-openlist/build/outputs -name "*.aar" 2>/dev/null | head -1)
          if [ -z "$AAR_PATH" ] || [ ! -f "$AAR_PATH" ]; then
            echo "❌ No plugin-openlist AAR found (可能 plugin-openlist 编译失败)"
            echo "可能的根因：libs/openlist-classes.jar 不存在，compileKotlin 缺 openlistlib 引用"
            echo "修复：CI 步骤 'Extract OpenList AAR for plugin packaging' 必须成功"
            exit 0
          fi
          echo "=== AAR: $AAR_PATH ==="
          ls -lh "$AAR_PATH"
          mkdir -p /tmp/aar-inspect && cd /tmp/aar-inspect
          rm -rf * && unzip -o "$AAR_PATH" >/dev/null
          echo
          echo "=== AAR contents ==="
          unzip -l "$AAR_PATH" | tail -20
          echo
          echo "=== classes.jar classes (按包分组) ==="
          if [ -f classes.jar ]; then
            unzip -l classes.jar | awk '{print $NF}' | grep -E "\.class$" | awk -F'/' '{print $1"/"$2"/"$3"/"$4}' | sort -u | head -30
            echo
            echo "--- openlistlib 包是否存在 ---"
            unzip -l classes.jar | grep -E "openlistlib/" | head -20
            if unzip -l classes.jar | grep -q "openlistlib/Event.class"; then
              echo "✅ openlistlib/Event.class 在 classes.jar 里"
            else
              echo "❌ openlistlib/Event.class 不在 classes.jar 里 ← A3.3 sourceSet 注入未生效 或 openlist-classes.jar 缺失"
            fi
          else
            echo "❌ classes.jar 不在 aar 里（异常情况）"
          fi

      - name: Inspect sourceSet injection (A3.3 unpackOpenlistClasses task)
        if: inputs.skip_plugin != true
        continue-on-error: true
        run: |
          # A3.4: 看 sourceSet 注入任务是否真跑了
          # preBuild → unpackOpenlistClasses → 解压到 build/generated/openlistlib/
          cd app/encv-mobile/android

          echo "=== build.gradle.kts sourceSet 注入检查 ==="
          grep -n "srcDir.*generated/openlistlib" plugin-openlist/build.gradle.kts || echo "❌ sourceSet 注入行未找到"
          echo
          grep -n "unpackOpenlistClasses\|afterEvaluate" plugin-openlist/build.gradle.kts | head -10

          echo
          echo "=== run unpackOpenlistClasses task (--dry-run) ==="
          ./gradlew :plugin-openlist:unpackOpenlistClasses --dry-run 2>&1 | tail -20 || true

          echo
          echo "=== libs/openlist-classes.jar 现状 ==="
          ls -lh plugin-openlist/libs/openlist-classes.jar 2>/dev/null || echo "❌ libs/openlist-classes.jar 不存在 ← CI Extract OpenList AAR 步骤未跑/失败"

          echo
          echo "=== build/generated/openlistlib/ 现状 ==="
          if [ -d plugin-openlist/build/generated/openlistlib ]; then
            find plugin-openlist/build/generated/openlistlib -name "*.class" | head -10
            echo "class 数量: $(find plugin-openlist/build/generated/openlistlib -name "*.class" 2>/dev/null | wc -l)"
          else
            echo "❌ build/generated/openlistlib/ 不存在 ← unpackOpenlistClasses 任务未跑过"
          fi

      - name: Run kotlinc verify on OpenListBridge (sandbox sim)
        if: inputs.skip_plugin != true
        continue-on-error: true
        run: |
          # A3.4: 用 kotlinc 直接编译 OpenListBridge.kt + libs/openlist-classes.jar
          # 如果 unresolved 'openlistlib' 出现 → classes.jar 不含 openlistlib 类
          # 如果 unresolved 'openlistlib' 消失 → classes.jar 含 openlistlib 类（CI 提取成功）
          cd app/encv-mobile/plugin-openlist

          if [ ! -f libs/openlist-classes.jar ]; then
            echo "❌ libs/openlist-classes.jar 不存在，跳过 kotlinc verify"
            echo "CI Extract OpenList AAR 步骤未成功，无法验证"
            exit 0
          fi
          echo "=== libs/openlist-classes.jar 内容 ==="
          unzip -l libs/openlist-classes.jar | head -20
          echo
          echo "=== openlistlib classes in classes.jar ==="
          unzip -l libs/openlist-classes.jar | grep -E "openlistlib/" | head -10
          if ! unzip -l libs/openlist-classes.jar | grep -q "openlistlib/Event.class"; then
            echo "❌ openlistlib/Event.class 不在 classes.jar 里 ← gomobile bind 产物异常"
            exit 0
          fi
          echo "✅ openlistlib/Event.class 在 classes.jar 里"

          # find kotlinc
          KOTLINC=""
          for p in /usr/local/bin/kotlinc /root/.local/share/mise/installs/kotlin/*/bin/kotlinc; do
            [ -x "$p" ] && KOTLINC="$p" && break
          done
          if [ -z "$KOTLINC" ]; then
            KOTLINC=$(find / -name kotlinc -executable 2>/dev/null | head -1)
          fi
          echo "kotlinc=$KOTLINC"
          if [ -z "$KOTLINC" ]; then
            echo "⚠️ kotlinc 不可用，跳过编译验证"
            exit 0
          fi
          echo
          echo "=== kotlinc compile OpenListBridge.kt (with classes.jar classpath) ==="
          rm -rf /tmp/openlist-verify
          "$KOTLINC" -no-stdlib -no-reflect -Xsuppress-version-warnings \
            -classpath "libs/openlist-classes.jar" \
            src/main/java/com/encvgo/plugin/openlist/OpenListBridge.kt \
            -d /tmp/openlist-verify 2>&1 | grep -E "openlistlib|unresolved reference" | head -20 || true
          echo
          echo "=== verify result ==="
          if [ -f /tmp/openlist-verify/com/encvgo/plugin/openlist/OpenListBridge.class ]; then
            echo "✅ OpenListBridge.class 生成成功 — openlistlib 类在 classpath 中"
          else
            echo "❌ OpenListBridge.class 未生成 — openlistlib 类不可见（compileKotlin 必失败）"
          fi

      - name: Upload diagnostic bundle
        if: always() && inputs.skip_plugin != true
        continue-on-error: true
        run: |
          # A3.4: 把所有诊断产物都打到 artifact
          mkdir -p /tmp/diagnostic
          cp -r /tmp/apk-inspect /tmp/diagnostic/ 2>/dev/null || true
          cp -r /tmp/aar-inspect /tmp/diagnostic/ 2>/dev/null || true
          cp -r /tmp/openlist-verify /tmp/diagnostic/ 2>/dev/null || true
          cd /workspace
          tar czf /tmp/diagnostic.tar.gz -C /tmp diagnostic 2>/dev/null
          ls -lh /tmp/diagnostic.tar.gz
          echo "/tmp/diagnostic.tar.gz" >> $GITHUB_STEP_SUMMARY
          # 上传为独立 artifact（不阻塞主 APK artifact）
          mkdir -p /tmp/diagnostic-artifact
          cp /tmp/diagnostic.tar.gz /tmp/diagnostic-artifact/openlist-diagnostic.tar.gz

      # === Build ===
      - name: Build ${{ inputs.version && 'Release' || 'Debug' }} APK
        env:
          BUGLY_APP_ID: ${{ secrets.BUGLY_APP_ID }}
        run: |
          cd app/encv-mobile

          if [ -n "${{ inputs.version }}" ]; then
            echo "=== Building RELEASE APK v${{ inputs.version }} ==="

            echo "=== Generating keystore.properties for signing ==="
            {
              echo "storeFile=${{ github.workspace }}/app/encv-mobile/keystore/release.jks"
              echo "storePassword=encv2025"
              echo "keyAlias=encvrelease"
              echo "keyPassword=encv2025"
            } > android/keystore.properties
            echo "keystore.properties created"

            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --stacktrace

            echo "=== Locating signed APK ==="
            ls -la app/build/outputs/apk/release/
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-unsigned*" -type f | head -1)
            [ -z "$APK_PATH" ] && { echo "::error::No APK found"; exit 1; }
            echo "Selected APK: $APK_PATH"

            echo "Verifying signature..."
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" -type f | head -1)
            [ -z "$APKSIGNER" ] && { echo "::error::apksigner not found in $ANDROID_HOME/build-tools"; exit 1; }
            if "$APKSIGNER" verify --print-certs "$APK_PATH"; then
              echo "✅ Signed OK: $(ls -lh "$APK_PATH" | awk '{print $5}')"
            else
              echo "::error::APK signature verification FAILED — signingConfig may not be applied in build.gradle.kts"
              exit 1
            fi
          else
            echo "=== Building DEBUG APK ==="
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Verify APK contents
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            APK_PATH=$(find app/encv-mobile/android/app/build/outputs/apk/release -name "*.apk" ! -name "*-unsigned*" -type f | head -1)
          else
            APK_PATH=$(find app/encv-mobile/android/app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          fi
          if [ -n "$APK_PATH" ]; then
            echo "=== APK size ==="
            ls -lh "$APK_PATH"
            echo "=== Assets ==="
            unzip -l "$APK_PATH" | grep -E "encv-go|config.mobile" || true

            echo "=== Web assets (public/index.html) ==="
            if unzip -l "$APK_PATH" | grep -q "public/index.html"; then
              echo "✅ PASS: Web assets found in APK"
              unzip -l "$APK_PATH" | grep "public/index.html"
            else
              echo "::error::Web assets (public/index.html) MISSING from APK! Did npx cap copy android run?"
              exit 1
            fi

            echo "=== Config file (config.user.json) ==="
            if unzip -l "$APK_PATH" | grep -q "config.user.json"; then
              echo "✅ PASS: config.user.json found in APK"
            else
              echo "::warning::config.user.json not in APK assets (will use fallback config on first launch)"
            fi

            echo "=== DEX strings check (real class presence) ==="
            TMPDIR=$(mktemp -d)
            unzip -q "$APK_PATH" -d "$TMPDIR"
            if [ -f "$TMPDIR/classes.dex" ]; then
              strings "$TMPDIR/classes.dex" | grep -i "encvgo\|GoProcess" && \
                echo "✅ GoProcess found in DEX (compiled+packaged)" || \
                echo "❌ Not found in DEX strings"
            else
              echo "❌ classes.dex missing!"
              ls "$TMPDIR/"*.dex 2>/dev/null || echo "No dex files"
            fi
            rm -rf "$TMPDIR"
            echo "=== Go binary in APK (jniLibs) ==="
            unzip -l "$APK_PATH" | grep -E "libencv-go|lib/arm64" || echo "❌ libencv-go.so NOT in APK!"
            echo "=== Host APK must NOT contain MPV .so ==="
            if unzip -l "$APK_PATH" | grep -q "libmpv\.so\|libplayer\.so"; then
              echo "❌ FAIL: Host APK contains MPV .so!"
              exit 1
            else
              echo "✅ PASS: Host APK excludes MPV .so"
            fi
            echo "=== Plugin loading strategy ==="
            if [ "${{ inputs.skip_plugin }}" = "true" ]; then
              echo "⏭️ Skipped (skip_plugin=true)"
            elif unzip -l "$APK_PATH" | grep -q "mpv-player.apk"; then
              echo "❌ FAIL: Plugin APK should NOT be bundled in host assets (disk-based loading)"
              exit 1
            else
              echo "✅ PASS: Plugin not bundled (loaded from filesDir/plugins/ at runtime)"
            fi
          else
            echo "No APK found to verify"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: encv-go-android${{ inputs.version && format('-v{0}', inputs.version) || '-debug' }}
          path: |
            app/encv-mobile/android/app/build/outputs/apk/**/*.apk
            app/encv-mobile/android/build/outputs/plugin-apks/**/*.apk
            app/encv-mobile/android/build/**/plugin-openlist*.apk
          retention-days: 3

      - name: Upload OpenList diagnostic bundle
        if: always() && inputs.skip_plugin != true
        uses: actions/upload-artifact@v4
        with:
          name: openlist-diagnostic${{ inputs.version && format('-v{0}', inputs.version) || '-debug' }}
          path: /tmp/diagnostic-artifact/openlist-diagnostic.tar.gz
          retention-days: 7
          if-no-files-found: warn

      - name: Build summary
        if: always()
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ inputs.version || 'debug (development)' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Go Binary | $(ls -lh app/encv-mobile/encv-go-arm64 2>/dev/null | awk '{print $5}' || echo N/A) |" >> $GITHUB_STEP_SUMMARY
          echo "| OpenList AAR | $(ls -lh app/encv-mobile/plugin-openlist/libs/openlist.aar 2>/dev/null | awk '{print $5}' || echo N/A) |" >> $GITHUB_STEP_SUMMARY
          find app/encv-mobile/android/app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | while read apk; do
            echo "| APK | $(basename "$apk") ($(\ls -lh "$apk" | awk '{print $5}')) |" >> $GITHUB_STEP_SUMMARY
          done
          find app/encv-mobile/android/build -name "plugin-openlist-*.apk" -type f 2>/dev/null | while read apk; do
            echo "| OpenList Plugin APK | $(basename "$apk") ($(\ls -lh "$apk" | awk '{print $5}')) |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### A3.4 诊断产物" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "完整诊断包已上传为独立 artifact：**openlist-diagnostic-{version}.tar.gz**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "包含:" >> $GITHUB_STEP_SUMMARY
          echo "- \`apk-inspect/classes*.dex\` — plugin APK 的 classes.dex 提取（含 openlistlib 类字符串扫描结果）" >> $GITHUB_STEP_SUMMARY
          echo "- \`aar-inspect/classes.jar\` — plugin-openlist.aar 的中间 classes.jar 列表（含 openlistlib 类是否合并）" >> $GITHUB_STEP_SUMMARY
          echo "- \`openlist-verify/com/encvgo/plugin/openlist/OpenListBridge.class\` — kotlinc 验证编译产物" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "请在 GitHub Actions 页面下载该 artifact 并解包查看，定位 A3 修复是否真生效。" >> $GITHUB_STEP_SUMMARY
