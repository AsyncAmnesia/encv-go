name: Build Android APK

on:
  push:
    branches: [ feature/capacitor-mobile ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build tools
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install frontend dependencies
        run: cd app/encv-mobile && npm install

      - name: Build frontend
        run: cd app/encv-mobile && npm run build

      - name: Build Go binary for Android arm64
        run: |
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -o app/encv-mobile/encv-go-arm64 ./cmd/encv

      - name: Add Capacitor Android platform
        run: cd app/encv-mobile && npx cap add android

      - name: Configure Kotlin 2.1 in Android project
        run: |
          cd app/encv-mobile/android
          python3 -c "
          import re
          # Root build.gradle: add kotlin plugin to buildscript.dependencies
          with open('build.gradle', 'r') as f:
              content = f.read()
          if 'kotlin-gradle-plugin' not in content:
              content = content.replace(
                  'dependencies {',
                  'dependencies {\n        classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0\"',
                  1
              )
          with open('build.gradle', 'w') as f:
              f.write(content)
          # App build.gradle: add kotlin-android plugin and kotlin-stdlib
          with open('app/build.gradle', 'r') as f:
              content = f.read()
          if 'kotlin-android' not in content:
              content = content.replace(
                  \"'com.android.application'\",
                  \"'com.android.application'\\n    'kotlin-android'\",
                  1
              )
          if 'kotlin-stdlib' not in content:
              content = content.replace(
                  'dependencies {',
                  'dependencies {\n    implementation \"org.jetbrains.kotlin:kotlin-stdlib:2.1.0\"',
                  1
              )
          with open('app/build.gradle', 'w') as f:
              f.write(content)
          "

      - name: Apply Android overlay (MainActivity + permissions)
        run: |
          cp -r app/encv-mobile/android-overlay/app/src/main/java/* app/encv-mobile/android/app/src/main/java/
          python3 -c "
          import xml.etree.ElementTree as ET
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          base = ET.parse('app/encv-mobile/android/app/src/main/AndroidManifest.xml')
          base_root = base.getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          permissions = [
              'android.permission.INTERNET',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.READ_MEDIA_VIDEO',
              'android.permission.READ_MEDIA_AUDIO',
              'android.permission.READ_MEDIA_IMAGES',
              'android.permission.READ_EXTERNAL_STORAGE',
          ]
          for perm_name in permissions:
              perm = ET.SubElement(base_root, 'uses-permission')
              perm.set(ns + 'name', perm_name)
              if perm_name == 'android.permission.READ_EXTERNAL_STORAGE':
                  perm.set(ns + 'maxSdkVersion', '32')
          base.write('app/encv-mobile/android/app/src/main/AndroidManifest.xml', xml_declaration=True, encoding='utf-8')
          "

      - name: Copy Go binary to Android assets
        run: |
          mkdir -p app/encv-mobile/android/app/src/main/assets
          cp app/encv-mobile/encv-go-arm64 app/encv-mobile/android/app/src/main/assets/encv-go

      - name: Sync Capacitor
        run: cd app/encv-mobile && npx cap sync android

      - name: Build APK (debug)
        run: |
          cd app/encv-mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: encv-go-android-apk
          path: app/encv-mobile/android/app/build/outputs/apk/debug/app-debug.apk
