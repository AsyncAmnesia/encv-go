name: Build Android APK

on:
  push:
    branches: [ feature/capacitor-mobile ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install frontend dependencies
        run: cd app/encv-mobile && npm install

      - name: Build frontend
        run: cd app/encv-mobile && npm run build

      - name: Build Go binary for Android
        run: |
          GOOS=android GOARCH=arm64 go build -o encv-go-android-arm64 ./cmd/encv

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: encv-go-binaries
          path: |
            encv-go-android-arm64
