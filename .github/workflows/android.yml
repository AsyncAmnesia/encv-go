name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (defaults to current branch)'
        required: false
        default: ''
        type: string
      version:
        description: 'Version number (e.g. 1.0.0). When set, builds release APK.'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build tools
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install frontend dependencies & Build
        run: cd app/encv-mobile && npm install && npm run build

      - name: Build Go binary for Android arm64 (optimized)
        env:
          CGO_ENABLED: "0"
          GOOS: android
          GOARCH: arm64
        run: |
          go build \
            -ldflags="-s -w -X main.version=${{ inputs.version || 'dev' }}" \
            -o app/encv-mobile/encv-go-arm64 \
            ./cmd/encv
          echo "Go binary size:"
          ls -lh app/encv-mobile/encv-go-arm64

      # Keystore 放在 android/ 外面，避免被 cap add/cap sync 重建时覆盖
      - name: Restore release keystore from cache
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: app/encv-mobile/keystore
          key: encv-release-keystore

      - name: Ensure release keystore exists
        run: |
          KEYSTORE="app/encv-mobile/keystore/release.jks"
          if [ -f "$KEYSTORE" ]; then
            echo "Keystore ready:"
            ls -lh "$KEYSTORE"
          else
            echo "Creating new release keystore..."
            mkdir -p app/encv-mobile/keystore
            keytool -genkeypair -v -keystore "$KEYSTORE" \
              -storepass encv2025 -alias encvrelease \
              -keypass encv2025 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ENCV-go, OU=Personal, O=ENCV, L=Unknown, ST=Unknown, C=CN"
            echo "Keystore created:"
            ls -lh "$KEYSTORE"
          fi

      # cap sync triggers afterSync hook (capacitor.config.ts → post-cap-sync.mjs)
      # which handles: kotlin plugin, abiFilters, version, signingConfigs, minify, shrink
      - name: Sync Capacitor Android project
        env:
          ENCV_VERSION: ${{ inputs.version }}
        run: |
          cd app/encv-mobile
          if [ -d "./android" ] && [ -f "./android/build.gradle" ]; then
            npx cap sync android
          else
            rm -rf ./android && npx cap add android && npx cap sync android
          fi
          echo "Android project ready:"
          ls -la android/*.gradle android/app/*.gradle
          echo "=== Signing config in build.gradle ==="
          grep -A8 'signingConfigs' app/encv-mobile/android/app/build.gradle || echo "WARNING: No signingConfigs found!"
          grep 'signingConfig\|minifyEnabled' app/encv-mobile/android/app/build.gradle || echo "WARNING: No release signing found!"

      # === Non-Gradle customizations (after cap sync) ===
      - name: Copy assets, overlay files, and release config
        run: |
          mkdir -p app/encv-mobile/android/app/src/main/assets
          cp app/encv-mobile/encv-go-arm64 app/encv-mobile/android/app/src/main/assets/encv-go
          cp app/encv-mobile/assets/config.mobile.json app/encv-mobile/android/app/src/main/assets/config.mobile.json
          # Release config files (NEVER touched by cap sync — confirmed from source)
          cp app/encv-mobile/android-overlay/gradle.properties app/encv-mobile/android/gradle.properties
          echo "Assets:"
          ls -lhR app/encv-mobile/android/app/src/main/assets/
          echo "Release config:"
          ls -lh app/encv-mobile/android/gradle.properties

      - name: Patch AndroidManifest (permissions + network config)
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          base = ET.parse('app/encv-mobile/android/app/src/main/AndroidManifest.xml')
          root = base.getroot()
          ns = '{http://schemas.android.com/apk/res/android}'

          for app_tag in root.findall('application'):
              app_tag.set(ns + 'networkSecurityConfig', '@xml/network_security_config')
              app_tag.set(ns + 'usesCleartextTraffic', 'true')

          perms = [
              ('android.permission.INTERNET', None),
              ('android.permission.FOREGROUND_SERVICE', None),
              ('android.permission.POST_NOTIFICATIONS', None),
              ('android.permission.READ_MEDIA_VIDEO', None),
              ('android.permission.READ_MEDIA_AUDIO', None),
              ('android.permission.READ_MEDIA_IMAGES', None),
              ('android.permission.READ_EXTERNAL_STORAGE', {'maxSdkVersion': '32'}),
              ('android.permission.WRITE_EXTERNAL_STORAGE', {'maxSdkVersion': '28'}),
              ('android.permission.MANAGE_EXTERNAL_STORAGE', None),
              ('android.permission.WAKE_LOCK', None),
          ]
          existing_perms = {p.get(ns + 'name', '') for p in root.findall('uses-permission')}
          for perm_name, attrs in perms:
              if perm_name not in existing_perms:
                  perm = ET.SubElement(root, 'uses-permission')
                  perm.set(ns + 'name', perm_name)
                  if attrs:
                      for k, v in attrs.items():
                          perm.set(ns + k, v)

          base.write('app/encv-mobile/android/app/src/main/AndroidManifest.xml', xml_declaration=True, encoding='utf-8')
          print('AndroidManifest patched')
          "

      # === Verify kotlin setup before build ===
      - name: Verify build.gradle kotlin setup
        run: |
          echo "=== kotlin-android plugin ==="
          grep -n "kotlin-android" app/encv-mobile/android/app/build.gradle || { echo "❌ MISSING: kotlin-android plugin!"; exit 1; }
          echo "=== kotlin-stdlib dependency ==="
          grep -n "kotlin-stdlib" app/encv-mobile/android/app/build.gradle || echo "⚠️ WARNING: kotlin-stdlib not found"
          echo "=== jvmTarget ==="
          grep -n "jvmTarget" app/encv-mobile/android/app/build.gradle || echo "⚠️ WARNING: jvmTarget not found"
          echo "=== proguard-rules.pro ==="
          test -f app/encv-mobile/android/app/proguard-rules.pro && echo "✅ proguard-rules.pro exists" || echo "⚠️ WARNING: no proguard-rules.pro"
          echo "=== GoProcessPlugin.kt source ==="
          test -f app/encv-mobile/android/app/src/main/java/com/encvgo/app/GoProcessPlugin.kt && echo "✅ GoProcessPlugin.kt exists" || echo "❌ MISSING: GoProcessPlugin.kt!"
          echo "=== MainActivity.kt source ==="
          test -f app/encv-mobile/android/app/src/main/java/com/encvgo/app/MainActivity.kt && echo "✅ MainActivity.kt exists" || echo "❌ MISSING: MainActivity.kt!"
          echo "✅ All checks passed"

      # === Build ===
      - name: Build ${{ inputs.version && 'Release' || 'Debug' }} APK
        run: |
          cd app/encv-mobile/android
          chmod +x gradlew

          if [ -n "${{ inputs.version }}" ]; then
            echo "=== Building RELEASE APK v${{ inputs.version }} ==="
            ./gradlew assembleRelease

            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
            [ -z "$APK_PATH" ] && { echo "::error::No APK found"; exit 1; }

            echo "Verifying signature..."
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" -type f | head -1)
            [ -z "$APKSIGNER" ] && { echo "::error::apksigner not found in $ANDROID_HOME/build-tools"; exit 1; }
            "$APKSIGNER" verify --print-certs "$APK_PATH"
            echo "✅ Signed OK: $(ls -lh "$APK_PATH" | awk '{print $5}')"
          else
            echo "=== Building DEBUG APK ==="
            ./gradlew assembleDebug
          fi

      - name: Verify APK contents
        run: |
          APK_PATH=$(find app/encv-mobile/android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "=== APK size ==="
            ls -lh "$APK_PATH"
            echo "=== Assets ==="
            unzip -l "$APK_PATH" | grep -E "encv-go|config.mobile" || true
            echo "=== DEX strings check (real class presence) ==="
            TMPDIR=$(mktemp -d)
            unzip -q "$APK_PATH" -d "$TMPDIR"
            if [ -f "$TMPDIR/classes.dex" ]; then
              strings "$TMPDIR/classes.dex" | grep -i "encvgo\|GoProcess" && \
                echo "✅ GoProcess found in DEX (compiled+packaged)" || \
                echo "❌ Not found in DEX strings"
            else
              echo "❌ classes.dex missing!"
              ls "$TMPDIR/"*.dex 2>/dev/null || echo "No dex files"
            fi
            rm -rf "$TMPDIR"
            echo "=== Build output .class files ==="
            find app/encv-mobile/android/app/build/tmp/kotlin-classes -name "*.class" -path "*encvgo*" 2>/dev/null && \
              echo "✅ encvgo .class in kotlin-classes" || \
              echo "⚠️ No encvgo .class (may be cleaned)"
            echo "=== capacitor.plugins.json ==="
            unzip -p "$APK_PATH" assets/capacitor.plugins.json
          else
            echo "No APK found to verify"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: encv-go-android${{ inputs.version && format('-v{0}', inputs.version) || '-debug' }}
          path: app/encv-mobile/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ inputs.version || 'debug (development)' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Go Binary | $(ls -lh app/encv-mobile/encv-go-arm64 2>/dev/null | awk '{print $5}' || echo N/A) |" >> $GITHUB_STEP_SUMMARY
          find app/encv-mobile/android/app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | while read apk; do
            echo "| APK | $(basename "$apk") ($(\ls -lh "$apk" | awk '{print $5}')) |" >> $GITHUB_STEP_SUMMARY
          done
