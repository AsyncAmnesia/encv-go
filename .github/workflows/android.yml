name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (defaults to current branch)'
        required: false
        default: ''
        type: string
      version:
        description: 'Version number (e.g. 1.0.0). When set, builds release APK.'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build tools
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup NDK for libplayer.so build
        run: |
          echo "Installing NDK..."
          sdkmanager "ndk;26.1.10909125"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          if [ -f "$ANDROID_NDK_HOME/ndk-build" ]; then
            echo "✅ NDK ready at $ANDROID_NDK_HOME"
            ls -la "$ANDROID_NDK_HOME/ndk-build"
          else
            echo "❌ ndk-build not found at $ANDROID_NDK_HOME"
            exit 1
          fi

      - name: Install frontend dependencies & Build
        run: cd app/encv-mobile && npm install && npm run build

      - name: Build Lynx player bundle
        run: cd app/encv-mobile/lynx-player && npm install && npm run build

      - name: Setup mpv native libraries
        run: cd app/encv-mobile && bash scripts/setup-mpv-libs.sh

      - name: Build Go binary for Android arm64 (optimized)
        env:
          CGO_ENABLED: "0"
          GOOS: android
          GOARCH: arm64
        run: |
          go build \
            -ldflags="-s -w -X main.version=${{ inputs.version || 'dev' }}" \
            -o app/encv-mobile/encv-go-arm64 \
            ./cmd/encv
          echo "Go binary size:"
          ls -lh app/encv-mobile/encv-go-arm64

      # Keystore stored outside android/app to avoid accidental commit
      - name: Restore release keystore from cache
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: app/encv-mobile/keystore
          key: encv-release-keystore

      - name: Ensure release keystore exists
        run: |
          KEYSTORE="app/encv-mobile/keystore/release.jks"
          if [ -f "$KEYSTORE" ]; then
            echo "Keystore ready:"
            ls -lh "$KEYSTORE"
          else
            echo "Creating new release keystore..."
            mkdir -p app/encv-mobile/keystore
            keytool -genkeypair -v -keystore "$KEYSTORE" \
              -storepass encv2025 -alias encvrelease \
              -keypass encv2025 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=ENCV-go, OU=Personal, O=ENCV, L=Unknown, ST=Unknown, C=CN"
            echo "Keystore created:"
            ls -lh "$KEYSTORE"
          fi

      # android/ is in git — cap copy only copies web assets (lighter than cap sync)
      # For release builds, cap build includes its own sync, so this step is debug-only
      - name: Copy web assets to Android project (debug)
        if: inputs.version == ''
        run: |
          cd app/encv-mobile
          npx cap copy android
          echo "Android project ready:"
          ls -la android/*.gradle android/app/*.gradle

      # === Non-Gradle customizations ===
      - name: Copy Go binary to jniLibs
        run: |
          mkdir -p app/encv-mobile/android/app/src/main/jniLibs/arm64-v8a
          cp app/encv-mobile/encv-go-arm64 app/encv-mobile/android/app/src/main/jniLibs/arm64-v8a/libencv-go.so
          echo "JNI libs:"
          ls -lhR app/encv-mobile/android/app/src/main/jniLibs/

      # === Verify kotlin setup before build ===
      - name: Verify AndroidManifest integrity
        run: |
          cd app/encv-mobile
          echo "=== Capacitor plugins ==="
          npx cap ls android
          echo "=== Manifest checks ==="
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q 'android.intent.action.MAIN' "$MANIFEST" && echo "✅ MAIN intent-filter" || { echo "❌ MISSING: MAIN intent-filter!"; exit 1; }
          grep -q 'android.intent.category.LAUNCHER' "$MANIFEST" && echo "✅ LAUNCHER category" || { echo "❌ MISSING: LAUNCHER category!"; exit 1; }
          grep -q 'android:icon' "$MANIFEST" && echo "✅ android:icon" || { echo "❌ MISSING: android:icon!"; exit 1; }
          grep -q 'android:label' "$MANIFEST" && echo "✅ android:label" || { echo "❌ MISSING: android:label!"; exit 1; }
          grep -q 'android:theme' "$MANIFEST" && echo "✅ android:theme" || { echo "❌ MISSING: android:theme!"; exit 1; }
          echo "=== mipmap resources ==="
          find android/app/src/main/res -name "ic_launcher*" -type f | head -5 && echo "✅ mipmap icons found" || echo "⚠️ WARNING: no ic_launcher in res/"
          echo "✅ Manifest integrity OK"

      - name: Verify build.gradle kotlin setup
        run: |
          echo "=== kotlin-android plugin ==="
          grep -n "kotlin-android" app/encv-mobile/android/app/build.gradle || { echo "❌ MISSING: kotlin-android plugin!"; exit 1; }
          echo "=== kotlin-stdlib dependency ==="
          grep -n "kotlin-stdlib" app/encv-mobile/android/app/build.gradle || echo "⚠️ WARNING: kotlin-stdlib not found"
          echo "=== jvmTarget ==="
          grep -n "jvmTarget" app/encv-mobile/android/app/build.gradle || echo "⚠️ WARNING: jvmTarget not found"
          echo "=== jniLibs.srcDirs ==="
          grep -n "jniLibs.srcDirs" app/encv-mobile/android/app/build.gradle || echo "⚠️ WARNING: jniLibs.srcDirs not found"
          echo "=== useLegacyPackaging ==="
          grep -n "useLegacyPackaging" app/encv-mobile/android/app/build.gradle || echo "❌ MISSING: useLegacyPackaging not set!"
          echo "=== proguard-rules.pro ==="
          test -f app/encv-mobile/android/app/proguard-rules.pro && echo "✅ proguard-rules.pro exists" || echo "⚠️ WARNING: no proguard-rules.pro"
          echo "=== GoProcessPlugin.kt source ==="
          test -f app/encv-mobile/android/app/src/main/java/com/encvgo/app/GoProcessPlugin.kt && echo "✅ GoProcessPlugin.kt exists" || echo "❌ MISSING: GoProcessPlugin.kt!"
          echo "=== MainActivity.kt source ==="
          test -f app/encv-mobile/android/app/src/main/java/com/encvgo/app/MainActivity.kt && echo "✅ MainActivity.kt exists" || echo "❌ MISSING: MainActivity.kt!"
          echo "✅ All checks passed"

      - name: Pre-build diagnosis
        run: |
          echo "=== build.gradle kotlin/sourceSets/namespace ==="
          grep -n "kotlin\|sourceSets\|namespace\|apply plugin.*kotlin\|plugins\s*{" app/encv-mobile/android/app/build.gradle || true
          echo "=== Source .kt files ==="
          find app/encv-mobile/android/app/src/main/java -name "*.kt" -type f -exec sh -c 'echo "  {} ($(wc -l < {}) lines)"; head -1 {}' \;
          echo "=== AndroidManifest activity ==="
          grep -n "activity\|android:name" app/encv-mobile/android/app/src/main/AndroidManifest.xml | head -5

      # === Build ===
      - name: Build ${{ inputs.version && 'Release' || 'Debug' }} APK
        run: |
          cd app/encv-mobile

          if [ -n "${{ inputs.version }}" ]; then
            echo "=== Building RELEASE APK v${{ inputs.version }} ==="
            npx cap build android \
              --androidreleasetype APK \
              --keystorepath keystore/release.jks \
              --keystorepass encv2025 \
              --keystorealias encvrelease \
              --keystorealiaspass encv2025

            APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -1)
            [ -z "$APK_PATH" ] && { echo "::error::No APK found"; exit 1; }

            echo "Verifying signature..."
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" -type f | head -1)
            [ -z "$APKSIGNER" ] && { echo "::error::apksigner not found in $ANDROID_HOME/build-tools"; exit 1; }
            "$APKSIGNER" verify --print-certs "$APK_PATH"
            echo "✅ Signed OK: $(ls -lh "$APK_PATH" | awk '{print $5}')"
          else
            echo "=== Building DEBUG APK ==="
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Verify APK contents
        run: |
          APK_PATH=$(find app/encv-mobile/android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "=== APK size ==="
            ls -lh "$APK_PATH"
            echo "=== Assets ==="
            unzip -l "$APK_PATH" | grep -E "encv-go|config.mobile" || true
            echo "=== DEX strings check (real class presence) ==="
            TMPDIR=$(mktemp -d)
            unzip -q "$APK_PATH" -d "$TMPDIR"
            if [ -f "$TMPDIR/classes.dex" ]; then
              strings "$TMPDIR/classes.dex" | grep -i "encvgo\|GoProcess" && \
                echo "✅ GoProcess found in DEX (compiled+packaged)" || \
                echo "❌ Not found in DEX strings"
            else
              echo "❌ classes.dex missing!"
              ls "$TMPDIR/"*.dex 2>/dev/null || echo "No dex files"
            fi
            rm -rf "$TMPDIR"
            echo "=== Build output .class files ==="
            find app/encv-mobile/android/app/build/tmp/kotlin-classes -name "*.class" -path "*encvgo*" 2>/dev/null && \
              echo "✅ encvgo .class in kotlin-classes" || \
              echo "⚠️ No encvgo .class (may be cleaned)"
            echo "=== capacitor.plugins.json ==="
            unzip -p "$APK_PATH" assets/capacitor.plugins.json
            echo "=== Go binary in APK (jniLibs) ==="
            unzip -l "$APK_PATH" | grep -E "libencv-go|lib/arm64" || echo "❌ libencv-go.so NOT in APK!"
            echo "=== Go binary in APK (assets, legacy) ==="
            unzip -l "$APK_PATH" | grep -E "assets/encv-go" || echo "(no assets/encv-go, expected with jniLibs packaging)"
          else
            echo "No APK found to verify"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: encv-go-android${{ inputs.version && format('-v{0}', inputs.version) || '-debug' }}
          path: app/encv-mobile/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ inputs.version || 'debug (development)' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Go Binary | $(ls -lh app/encv-mobile/encv-go-arm64 2>/dev/null | awk '{print $5}' || echo N/A) |" >> $GITHUB_STEP_SUMMARY
          find app/encv-mobile/android/app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | while read apk; do
            echo "| APK | $(basename "$apk") ($(\ls -lh "$apk" | awk '{print $5}')) |" >> $GITHUB_STEP_SUMMARY
          done
