name: Build Android APK

on:
  push:
    branches: [ feature/capacitor-mobile ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build tools
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install frontend dependencies
        run: cd app/encv-mobile && npm install

      - name: Build frontend
        run: cd app/encv-mobile && npm run build

      - name: Build Go binary for Android arm64
        run: |
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -o app/encv-mobile/encv-go-arm64 ./cmd/encv

      - name: Add Capacitor Android platform
        run: cd app/encv-mobile && npx cap add android

      - name: Apply Android overlay (MainActivity + permissions)
        run: |
          cp -r app/encv-mobile/android-overlay/app/src/main/java/* app/encv-mobile/android/app/src/main/java/
          cp app/encv-mobile/android-overlay/app/src/main/AndroidManifest-overlay.xml /tmp/manifest-overlay.xml
          python3 -c "
          import xml.etree.ElementTree as ET
          base = ET.parse('app/encv-mobile/android/app/src/main/AndroidManifest.xml')
          overlay = ET.parse('/tmp/manifest-overlay.xml')
          base_root = base.getroot()
          overlay_root = overlay.getroot()
          for perm in overlay_root.findall('uses-permission'):
              base_root.append(perm)
          base.write('app/encv-mobile/android/app/src/main/AndroidManifest.xml', xml_declaration=True, encoding='utf-8')
          "

      - name: Copy Go binary to Android assets
        run: |
          mkdir -p app/encv-mobile/android/app/src/main/assets
          cp app/encv-mobile/encv-go-arm64 app/encv-mobile/android/app/src/main/assets/encv-go

      - name: Sync Capacitor
        run: cd app/encv-mobile && npx cap sync android

      - name: Build APK (debug)
        run: |
          cd app/encv-mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: encv-go-android-apk
          path: app/encv-mobile/android/app/build/outputs/apk/debug/app-debug.apk
