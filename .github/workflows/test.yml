name: Full Test Suite

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: false
        default: ''
        type: string
      skip_layer1:
        description: 'Skip Layer 1 quick tests'
        required: false
        default: 'false'
        type: boolean
      skip_e2e:
        description: 'Skip Layer 3 E2E tests'
        required: false
        default: 'false'
        type: boolean
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'

env:
  NDK_VERSION: "26.1.10909125"

jobs:
  layer1-quick-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_layer1 != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        test-group: [frontend-vitest, go-core-test, combolite-static, r8-guard]
    outputs:
      layer1-result: ${{ steps.test-result.outputs.result }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Set up Node.js
        if: matrix.test-group == 'frontend-vitest'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/encv-mobile/package-lock.json

      - name: Set up Go
        if: matrix.test-group != 'frontend-vitest'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum

      - name: Cache npm dependencies
        if: matrix.test-group == 'frontend-vitest'
        uses: actions/cache@v4
        with:
          path: app/encv-mobile/node_modules
          key: npm-main-${{ hashFiles('app/encv-mobile/package-lock.json') }}
          restore-keys: npm-main-

      - name: Install frontend dependencies
        if: matrix.test-group == 'frontend-vitest'
        run: cd app/encv-mobile && npm install

      - name: Run frontend vitest
        if: matrix.test-group == 'frontend-vitest'
        id: frontend-test
        run: |
          cd app/encv-mobile
          npx vitest run --reporter=verbose 2>&1 | tee test-output.txt
          echo "result=$(grep -q 'passed' test-output.txt && echo 'success' || echo 'failure')" >> $GITHUB_OUTPUT

      - name: Run Go core tests
        if: matrix.test-group == 'go-core-test'
        id: go-core-test
        run: |
          echo "═══ Go Core Tests ═══"
          go test ./internal/service/ ./internal/v2/plugins/video/ -count=1 -timeout 120s -v 2>&1 | tee test-output.txt
          echo "result=$(grep -q 'PASS' test-output.txt && echo 'success' || echo 'failure')" >> $GITHUB_OUTPUT

      - name: Run ComboLite static check
        if: matrix.test-group == 'combolite-static'
        id: combolite-test
        run: |
          echo "═══ ComboLite Static Check ═══"
          go test ./internal/service/ -count=1 -timeout 60s -run TestComboLite -v 2>&1 | tee test-output.txt
          echo "result=$(grep -q 'PASS' test-output.txt && echo 'success' || echo 'failure')" >> $GITHUB_OUTPUT

      - name: Check R8/ProGuard is disabled for ALL build variants
        if: matrix.test-group == 'r8-guard'
        id: r8-guard-test
        run: |
          set +e
          exec 2>&1

          echo "╔══════════════════════════════════════════════════╗"
          echo "║     R8 / ProGuard Obfuscation Guard (v2)        ║"
          echo "╚══════════════════════════════════════════════════╝"
          echo ""

          VIOLATIONS=0
          WARNINGS=0
          FILES_CHECKED=0

          ALL_FILES=$(find app/encv-mobile/android -name "*.gradle.kts" -not -path "*/build/*" -type f | sort)
          FILE_COUNT=$(echo "$ALL_FILES" | grep -c .)

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No .gradle.kts files found! Search path may be wrong."
            echo "result=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "   Found $FILE_COUNT file(s):"
          while IFS= read -r line || [ -n "$line" ]; do
            echo "     ✦ $line"
          done < <(echo "$ALL_FILES")
          echo ""

          echo "🔍 Phase 2: Checking each file..."
          echo ""

          while IFS= read -r f || [ -n "$f" ]; do
            FILES_CHECKED=$((FILES_CHECKED + 1))
            RELPATH=${f#app/encv-mobile/android/}
            echo "--- [$FILES_CHECKED/$FILE_COUNT] $RELPATH ---"

            MINIFY_MATCH=$(grep -n 'isMinifyEnabled\s*=\s*true' "$f" 2>/dev/null)
            if [ -n "$MINIFY_MATCH" ]; then
              echo "   ❌ FATAL: isMinifyEnabled = true found:"
              echo "$MINIFY_MATCH" | while read line; do echo "      $line"; done
              echo "::error file=$f,line=$(echo "$MINIFY_MATCH" | head -1 | cut -d: -f1)::R8 minification ENABLED — ComboLite incompatible!"
              VIOLATIONS=$((VIOLATIONS + 1))
            else
              echo "   ✅ isMinifyEnabled ≠ true (OK)"
            fi

            SHRINK_MATCH=$(grep -n 'isShrinkResources\s*=\s*true' "$f" 2>/dev/null)
            if [ -n "$SHRINK_MATCH" ]; then
              echo "   ⚠️  WARNING: isShrinkResources = true found:"
              echo "$SHRINK_MATCH" | while read line; do echo "      $line"; done
              echo "::warning file=$f,line=$(echo "$SHRINK_MATCH" | head -1 | cut -d: -f1)::Resource shrinking enabled (SAFE with ComboLite)"
              WARNINGS=$((WARNINGS + 1))
            else
              echo "   isShrinkResources ≠ true (not set)"
            fi

            LEGACY_MATCH=$(grep -n 'minifyEnabled\s*=\s*true' "$f" 2>/dev/null)
            if [ -n "$LEGACY_MATCH" ]; then
              echo "   ❌ FATAL: Legacy minifyEnabled=true found:"
              echo "$LEGACY_MATCH" | while read line; do echo "      $line"; done
              echo "::error file=$f,line=$(echo "$LEGACY_MATCH" | head -1 | cut -d: -f1)::Legacy R8 minification enabled"
              VIOLATIONS=$((VIOLATIONS + 1))
            else
              echo "   Legacy minifyEnabled ≠ true (OK)"
            fi

            ACTUAL_MINIFY=$(grep 'isMinifyEnabled' "$f" 2>/dev/null | head -1)
            ACTUAL_SHRINK=$(grep 'isShrinkResources' "$f" 2>/dev/null | head -1)
            if [ -n "$ACTUAL_MINIFY" ] || [ -n "$ACTUAL_SHRINK" ]; then
              echo "   📝 Actual config:"
              [ -n "$ACTUAL_MINIFY" ] && echo "      $ACTUAL_MINIFY"
              [ -n "$ACTUAL_SHRINK" ] && echo "      $ACTUAL_SHRINK"
            fi
            echo ""
          done < <(echo "$ALL_FILES")

          echo "╔══════════════════════════════════════════════════╗"
          echo "║           GUARD VERDICT                        ║"
          echo "╠══════════════════════════════════════════════════╣"
          echo "║ Files scanned : $FILE_COUNT                        ║"
          echo "║ Violations    : $VIOLATIONS (FATAL → blocks build)    ║"
          echo "║ Warnings      : $WARNINGS (info only)                ║"
          echo "╚══════════════════════════════════════════════════╝"
          echo ""

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "::error::❌ GUARD FAILED: $VIOLATIONS violation(s). Fix: isMinifyEnabled=false. See .trae/rules/combolite.md §1.3"
            echo "result=failure" >> $GITHUB_OUTPUT
          else
            echo "✅ GUARD PASSED: No R8/ProGuard obfuscation found."
            if [ "$WARNINGS" -gt 0 ]; then
              echo "⚠️  $WARNINGS resource shrink warning(s) above (safe with ComboLite)."
            fi
            echo "result=success" >> $GITHUB_OUTPUT
          fi

      - name: Set overall test result
        id: test-result
        run: |
          if [ "${{ matrix.test-group }}" = "frontend-vitest" ]; then
            echo "result=${{ steps.frontend-test.outputs.result }}" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.test-group }}" = "go-core-test" ]; then
            echo "result=${{ steps.go-core-test.outputs.result }}" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.test-group }}" = "combolite-static" ]; then
            echo "result=${{ steps.combolite-test.outputs.result }}" >> $GITHUB_OUTPUT
          else
            echo "result=${{ steps.r8-guard-test.outputs.result }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer1-${{ matrix.test-group }}-output
          path: test-output.txt
          retention-days: 7
          if-no-files-found: ignore

  layer2-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: layer1-quick-tests
    if: always() && needs.layer1-quick-tests.outputs.layer1-result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/encv-mobile/package-lock.json

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: app/encv-mobile/node_modules
          key: npm-main-${{ hashFiles('app/encv-mobile/package-lock.json') }}
          restore-keys: npm-main-

      - name: Install frontend dependencies
        run: cd app/encv-mobile && npm install

      - name: Run Go full tests with coverage
        id: go-full-test
        run: |
          echo "═══ Go Full Regression with Coverage ═══"
          go test ./internal/... -count=1 -timeout 300s -coverprofile=cover.out -v 2>&1 | tee go-test-output.txt
          go tool cover -html=cover.out -o coverage.html
          echo "result=$(grep -q 'PASS' go-test-output.txt && echo 'success' || echo 'failure')" >> $GITHUB_OUTPUT

      - name: Run frontend tests with coverage
        id: frontend-coverage
        run: |
          cd app/encv-mobile
          npx vitest run --coverage --reporter=verbose 2>&1 | tee frontend-coverage-output.txt
          echo "result=$(grep -q 'passed' frontend-coverage-output.txt && echo 'success' || echo 'failure')" >> $GITHUB_OUTPUT

      - name: Upload Go coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-report
          path: |
            cover.out
            coverage.html
          retention-days: 7

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: app/encv-mobile/coverage/
          retention-days: 7
          if-no-files-found: ignore

  layer3-e2e-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: layer2-full-regression
    if: always() && (needs.layer2-full-regression.result == 'success' || github.event_name == 'schedule') && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_e2e != 'true')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum

      - name: Run encryption E2E tests
        id: e2e-test
        run: |
          echo "═══ Encryption E2E Roundtrip Tests ═══"
          go test ./internal/v2/plugins/video/ -run TestEncryptionE2E -v -count=1 -timeout 300s 2>&1 | tee e2e-output.txt
          echo "result=$(grep -q 'PASS' e2e-output.txt && echo 'success' || echo 'failure')" >> $GITHUB_OUTPUT

      - name: Config consistency check
        run: |
          echo "═══ Config Consistency Check ═══"
          if [ -f "config.user.json" ]; then
            echo "✅ config.user.json exists"
            cat config.user.json | jq '.' > /dev/null && echo "✅ JSON valid" || echo "❌ JSON invalid"
          else
            echo "⚠️ config.user.json not found (using fallback)"
          fi

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: e2e-output.txt
          retention-days: 7

  test-summary:
    runs-on: ubuntu-latest
    needs: [layer1-quick-tests, layer2-full-regression, layer3-e2e-integration]
    if: always()

    steps:
      - name: Generate test summary
        run: |
          echo "## Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Layer | Status | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Layer 1 (Quick) | ${{ needs.layer1-quick-tests.result }} | ~5min |" >> $GITHUB_STEP_SUMMARY
          echo "| Layer 2 (Regression) | ${{ needs.layer2-full-regression.result || 'skipped' }} | ~15min |" >> $GITHUB_STEP_SUMMARY
          echo "| Layer 3 (E2E) | ${{ needs.layer3-e2e-integration.result || 'skipped' }} | ~20min |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.layer1-quick-tests.result }}" = "failure" ]; then
            echo "❌ **Layer 1 failed** — blocking further layers" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.layer2-full-regression.result }}" = "failure" ]; then
            echo "⚠️ **Layer 2 failed** — tests completed with errors" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.layer3-e2e-integration.result }}" = "failure" ]; then
            echo "⚠️ **Layer 3 failed** — E2E tests completed with errors" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **All tests passed**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Download all artifacts
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts

      - name: List artifacts
        if: always()
        run: |
          echo "### Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          ls -la test-artifacts/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No artifacts" >> $GITHUB_STEP_SUMMARY