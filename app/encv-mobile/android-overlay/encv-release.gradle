// encv-release.gradle — Release build configuration
// Applied via 'apply from: "../encv-release.gradle"' in app/build.gradle
// This file is NEVER touched by Capacitor cap sync
// Signing credentials come from android/gradle.properties (also not touched by cap sync)

android {
    signingConfigs {
        release {
            storeFile file(project.property('ENCV_STORE_FILE').toString())
            storePassword project.property('ENCV_STORE_PASSWORD').toString()
            keyAlias project.property('ENCV_KEY_ALIAS').toString()
            keyPassword project.property('ENCV_KEY_PASSWORD').toString()
        }
    }

    ndk {
        abiFilters 'arm64-v8a'
    }
}

android.buildTypes {
    release {
        minifyEnabled true
        shrinkResources true
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        signingConfig signingConfigs.release
    }
}
