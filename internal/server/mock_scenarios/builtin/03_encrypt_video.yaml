# encrypt_video — 加密视频剧本
#
# 用途：验证 plugin 工具确认流程（needsConfirm=true 写操作）。
# 触发：关键词（"加密视频" / "encrypt"）
#
# 关键：本剧本是**写操作**，execute_real=false。
# 真实加密由用户在确认流（needsConfirm=true）触发 — 永远不能因剧本误触发真加密。
#
# 数据完整性：
#   - args 内的 input_paths 是用户输入的过滤条件（不是硬编码数据）
#     → 实际生产中由 UI 的文件选择器填入
#   - text_delta 是通用 UI 文案
id: encrypt_video
description: "1 tool_call (kind=fileChange) — 验证 plugin 工具确认流程"
keywords:
  - 加密视频
  - 加密
  - encrypt
  - video

# 预设：tool_call 推出去之前用户可以点 chip 切换动作
#  注意：tool_call 仍会推送（needsConfirm=true），用户后续在确认卡上
#  点 Approve/Deny 决定是否真加密。preset 是"前哨"操作。
presets:
  - id: p_cancel
    label: "❌ 取消"
    user_text: "算了，不加密了"
    icon: "❌"
    tooltip: "取消加密动作"
  - id: p_modify_path
    label: "📁 改输出到 /Encrypted"
    user_text: "改加密输出到 /Encrypted 目录"
    icon: "📁"
    tooltip: "修改输出路径"
  - id: p_choose_other
    label: "📂 看其他视频"
    user_text: "有哪些视频文件"
    icon: "📂"
    tooltip: "跳到 list_files_query 选别的"

steps:
  - id: s1_stream_start
    delay_ms: 0
    events:
      - type: stream_start
        data: { scenario: encrypt_video }
      - type: text_delta
        data: { text: "好的，我来加密这个视频文件。" }

  - id: s2_tool_call
    delay_ms: 400
    events:
      - type: tool_call
        data:
          id: call_enc_1
          name: video_encrypt
          # args 是用户输入（由 UI 文件选择器填入），不是硬编码数据
          # 注意：模板值用占位（具体路径运行时填）
          args: { input_paths: ["<USER_SELECTED_VIDEO>"], output_path: "<USER_SELECTED_OUTPUT>" }
          auto_run: false
          needsConfirm: true
          kind: fileChange
          # 写操作：mock 模式绝不能实际执行（避免误删/误改用户文件）
          execute_real: false

  - id: s3_stream_end
    delay_ms: 100
    events:
      - type: stream_end
        data: { finishReason: tool_calls, usage: { totalTokens: 89 } }
