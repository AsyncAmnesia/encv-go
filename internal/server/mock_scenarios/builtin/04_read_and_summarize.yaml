# read_and_summarize — 读文件并总结
#
# 用途：验证只读文件工具 + 总结文本输出。
# 触发：关键词（"总结" / "summarize" / "摘要"）
#
# 数据完整性：
#   - args 内的 rel_path 是用户输入（"读哪个文件"），不是硬编码数据
#   - 真实文件内容由 execute_real=true 走真实 read_file 拿到
#   - text_delta 是通用 UI 文案（"核心要点如下" / 不含具体文件内容）
id: read_and_summarize
description: "read_file tool_call — 验证只读工具 + 总结"
keywords:
  - 总结
  - summarize
  - 摘要
  - 归纳

# 预设：用户看完 summary 后的常见后续
presets:
  - id: p_full
    label: "📜 看完整原文"
    user_text: "显示 readme.md 完整内容"
    icon: "📜"
    tooltip: "跳到 read_file 完整版"
  - id: p_bullets
    label: "🔹 bullet 列表版"
    user_text: "用 bullet 列表总结 readme.md"
    icon: "🔹"
    tooltip: "切换为列表格式"
  - id: p_translate
    label: "🌐 翻译成中文"
    user_text: "把 readme.md 翻译成中文"
    icon: "🌐"
    tooltip: "中文化输出"
  - id: p_save
    label: "💾 保存为摘要"
    user_text: "把这份总结保存到 notes/summary.md"
    icon: "💾"
    tooltip: "保存到文件（需确认）"

steps:
  - id: s1_stream_start
    delay_ms: 0
    events:
      - type: stream_start
        data: { scenario: read_and_summarize }
      - type: text_delta
        data: { text: "我先读取这个文件的内容。" }

  - id: s2_read_file
    delay_ms: 400
    events:
      - type: tool_call
        data:
          id: call_read_1
          name: read_file
          args: { mount_id: serving, rel_path: docs/readme.md }
          auto_run: true
          needsConfirm: false
          kind: readOnly
          execute_real: true

  - id: s3_text_continue
    delay_ms: 200
    events:
      - type: text_delta
        data: { text: "文件内容已读取。\n" }
      - type: text_delta
        data: { text: "## 核心要点\n\n- 见上方真实文件内容（tool_result）\n" }

  - id: s4_branch_choice
    delay_ms: 600
    events:
      - type: mock_branch_choice
        data:
          branch_id: post_summarize
          options:
            - id: bullets
              label: "🔹 bullet 列表"
              icon: "🔹"
            - id: translate
              label: "🌐 翻译"
              icon: "🌐"
            - id: save
              label: "💾 保存"
              icon: "💾"

  - id: s5_stream_end
    delay_ms: 100
    events:
      - type: stream_end
        data: { finishReason: stop, usage: { totalTokens: 156 } }
