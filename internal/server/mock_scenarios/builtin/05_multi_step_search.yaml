# multi_step_search — 3 轮真实工具调用
#
# 用途：验证 Agent Loop 多次工具调用 + 文本综合输出。
# 触发：关键词（"搜索" / "找视频"）
#
# 数据完整性：
#   - args 内的 rel_path 是用户输入（搜索起点）
#   - 所有 text_delta 是通用 UI 文案（不含具体文件大小/路径）
#   - mid-scenario mock_presets 是 chip 预设消息（不含硬编码数据）
id: multi_step_search
description: "3 轮 tool_call — list_files → list_files → stat_file 验证递归"
keywords:
  - 搜索
  - 查找
  - search
  - 找一下
  - 找视频

# 初始预设
presets:
  - id: p_init_listing
    label: "📂 先列 Movies"
    user_text: "列出 Movies 目录"
    icon: "📂"
    tooltip: 从入口开始
  - id: p_init_all_video
    label: "🎬 找所有视频"
    user_text: "找所有视频"
    icon: "🎬"
    tooltip: 触发完整 3 轮搜索
  - id: p_init_cancel
    label: "❌ 取消"
    user_text: "算了不找了"
    icon: "❌"
    tooltip: 退出搜索

steps:
  - id: s1_stream_start
    delay_ms: 0
    events:
      - type: stream_start
        data: { scenario: multi_step_search }
      - type: text_delta
        data: { text: "我来搜索视频文件。\n" }

  - id: s2_list_files_root
    delay_ms: 400
    events:
      - type: tool_call
        data:
          id: call_search_1
          name: list_files
          args: { mount_id: serving, rel_path: Movies }
          auto_run: true
          needsConfirm: false
          kind: readOnly
          execute_real: true

  - id: s3_list_files_sub
    delay_ms: 300
    events:
      - type: tool_call
        data:
          id: call_search_2
          name: list_files
          args: { mount_id: serving, rel_path: Movies/sub }
          auto_run: true
          needsConfirm: false
          kind: readOnly
          execute_real: true

  # ⏸️ Mid-scenario preset update：发现目标后切换 chip
  - id: s4_mid_presets
    delay_ms: 100
    events:
      - type: mock_presets
        data:
          scenario: multi_step_search
          phase: after_round_2
          presets:
            - id: p_stat
              label: "📊 看文件大小"
              user_text: "Movies/sub/target.mp4 多大"
              icon: "📊"
              tooltip: 触发 stat_file 详细输出
            - id: p_encrypt_found
              label: "🔒 加密这个文件"
              user_text: "加密 Movies/sub/target.mp4"
              icon: "🔒"
              tooltip: 跳到 encrypt_video
            - id: p_done
              label: "✅ 结束搜索"
              user_text: "好的，不用再找了"
              icon: "✅"
              tooltip: 结束本轮搜索

  # Round 3: stat_file
  - id: s5_stat_file
    delay_ms: 300
    events:
      - type: tool_call
        data:
          id: call_search_3
          name: stat_file
          args: { mount_id: serving, rel_path: Movies/sub/target.mp4 }
          auto_run: true
          needsConfirm: false
          kind: readOnly
          execute_real: true

  # ⚠️ 关键：text_delta 只说"搜索完成"，不写"1 个文件"或具体大小
  # 具体数字由前端从 tool_result 事件渲染
  - id: s6_text_summary
    delay_ms: 200
    events:
      - type: text_delta
        data: { text: "## 搜索完成\n\n" }
      - type: text_delta
        data: { text: "已在指定目录递归查询完毕，详见上方的真实工具结果。\n" }

  - id: s7_stream_end
    delay_ms: 100
    events:
      - type: stream_end
        data: { finishReason: stop, usage: { totalTokens: 423 } }
