# tool_call_with_args — 1 个 tool_call with explicit args
#
# 用途：验证前端 tool_call 卡片对 args 的 JSON 展开渲染。
# 触发：关键词（"test tool call" / "工具调用测试"）
#
# 数据完整性：
#   - args 是用户输入的查询参数（包含一些合理 query 条件）
#   - tool_result 由真实工具执行产生（不写死）
#   - text_delta 是通用 UI 文案
id: tool_call_with_args
description: "1 tool_call with structured args — 验证 args 渲染"
keywords:
  - test tool call
  - 工具调用测试
  - call tool
  - tool call

steps:
  - id: s1_stream_start
    delay_ms: 0
    events:
      - type: stream_start
        data: { scenario: tool_call_with_args }
      - type: text_delta
        data: { text: "好的，我来搜索视频文件。\n" }

  - id: s2_search_files
    delay_ms: 400
    events:
      - type: tool_call
        data:
          id: call_search_args
          name: search_files
          # args 是用户输入的查询（不是硬编码数据）
          # ext 和 min_size 是过滤条件
          args: { ext: .mp4, min_size: 104857600, recursive: true }
          auto_run: true
          needsConfirm: false
          kind: readOnly
          execute_real: true

  # text_delta 是通用总结，具体结果由 tool_result 渲染
  - id: s3_text_summary
    delay_ms: 800
    events:
      - type: text_delta
        data: { text: "## 搜索完成\n\n" }
      - type: text_delta
        data: { text: "已按您指定的扩展名和最小大小过滤完毕，详见上方工具结果。\n" }

  - id: s4_branch_choice
    delay_ms: 600
    events:
      - type: mock_branch_choice
        data:
          branch_id: post_search
          options:
            - id: relax
              label: "🎚️ 放宽条件"
              icon: "🎚️"
            - id: change_ext
              label: "📁 改其他格式"
              icon: "📁"
            - id: cancel
              label: "❌ 取消"
              icon: "❌"

  - id: s5_stream_end
    delay_ms: 100
    events:
      - type: stream_end
        data: { finishReason: stop, usage: { totalTokens: 167 } }
