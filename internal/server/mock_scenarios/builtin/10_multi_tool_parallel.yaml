# multi_tool_parallel — 多工具并行
#
# 用途：验证多个独立 tool_call 顺序触发 + 各自真实执行。
# 触发：关键词（"并行" / "parallel"）
#
# 数据完整性：
#   - 3 个 tool_call 并行触发（list_files + list_mounts + stat_file）
#   - args 各自是用户输入的查询参数
#   - text_delta 是通用 UI 文案（不含具体文件）
id: multi_tool_parallel
description: "3 tool_call 并行触发 — 验证并行执行与 SSE 排序"
keywords:
  - 并行
  - parallel
  - 同时执行
  - 多个工具

steps:
  - id: s1_stream_start
    delay_ms: 0
    events:
      - type: stream_start
        data: { scenario: multi_tool_parallel }
      - type: text_delta
        data: { text: "我将并行执行多个查询。\n" }

  # 3 个 tool_call 在同一 step 触发（前端按 SSE 顺序渲染）
  - id: s2_parallel_calls
    delay_ms: 400
    events:
      - type: tool_call
        data:
          id: call_par_1
          name: list_mounts
          args: {}
          auto_run: true
          needsConfirm: false
          kind: readOnly
          execute_real: true
      - type: tool_call
        data:
          id: call_par_2
          name: list_files
          args: { mount_id: serving, rel_path: / }
          auto_run: true
          needsConfirm: false
          kind: readOnly
          execute_real: true
      - type: tool_call
        data:
          id: call_par_3
          name: stat_file
          args: { mount_id: serving, rel_path: /health.txt }
          auto_run: true
          needsConfirm: false
          kind: readOnly
          execute_real: true

  # 等待所有工具执行完成（具体延迟由 MockEngine 调度）
  - id: s3_text_summary
    delay_ms: 1500
    events:
      - type: text_delta
        data: { text: "## 并行查询完成\n\n" }
      - type: text_delta
        data: { text: "所有 3 个工具已并行执行完毕，详见上方结果。\n" }

  - id: s4_stream_end
    delay_ms: 100
    events:
      - type: stream_end
        data: { finishReason: stop, usage: { totalTokens: 312 } }
