id: context_exhausted
description: "finishReason=length — 验证截断警告"
keywords:
  - "上下文爆了"
  - "超长"
  - "exhausted"
  - "token limit"
  - "太长"

presets:
  - id: p_clear_history
    label: "🧹 清空上下文"
    user_text: "清空上下文"
    tooltip: "清空历史会话重试"
  - id: p_split
    label: "✂️ 分两段问"
    user_text: "分段总结"
    tooltip: "分两轮问"
  - id: p_shorter
    label: "📝 简短回答"
    user_text: "简短回答"
    tooltip: "限制 max_tokens"

steps:
  - id: start
    delay_ms: 0
    events:
      - type: stream_start
        data: { scenario: context_exhausted }
      - type: text_delta
        data: { text: "（长文本达到模型上限）" }
  - id: end
    delay_ms: 100
    events:
      - type: stream_end
        data:
          finishReason: length
          usage:
            totalTokens: 131072
            maxTokens: 128000
