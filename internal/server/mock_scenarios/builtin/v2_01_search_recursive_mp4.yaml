# search_recursive_mp4 — 搜索 100MB+ 的 mp4（v2 单轮线性）
#
# 用途：演示 search_files 工具的递归 + size_gt + name_glob 三重过滤组合。
# 关键：tool_result 由真实工具执行产生（YAML 禁写 tool_result）。
# 数据完整性：text_delta 是通用 UI 文案，不含具体文件名/计数/大小。
#
# 触发：关键词 search_recursive_mp4
id: search_recursive_mp4
description: 搜索 100MB 以上的 mp4（递归 + glob）

keywords:
  - search_recursive_mp4

rounds: 1

steps:
  # Round 0: 启动流 + 提示
  - id: s1_start
    round_idx: 0
    delay_ms: 10
    events:
      - type: stream_start
        data: { scenario: search_recursive_mp4 }
      - type: text_delta
        # ✅ 通用 UI 文案
        data: { text: "正在搜索大于 100MB 的 MP4 文件…" }

  # Round 0: 调真实工具（engine 自动产生 tool_result）
  - id: s2_search
    round_idx: 0
    delay_ms: 30
    events:
      - type: tool_call
        data:
          id: call_srm_1
          name: search_files
          # ✅ args 是过滤条件（不是数据）
          args:
            expression:
              and:
                - { type: name_glob, value: "*.mp4" }
                - { type: size_gt,   value: 104857600 }
            recursive: true
            max_results: 20
          auto_run: true
          needsConfirm: false
          kind: fileSearch
          execute_real: true

  # Round 0: 收尾
  - id: s3_end
    round_idx: 0
    delay_ms: 50
    events:
      # 注意：tool_result 事件被自动注入（在 tool_call 之后），不需要手写
      - type: text_delta
        # ✅ 通用总结
        data: { text: "搜索完成。详见上方工具结果。" }
      - type: stream_end
        data: { finishReason: stop }
