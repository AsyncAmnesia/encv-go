# search_content_regex — 用正则搜索文件内容（v2 单轮线性）
#
# 用途：演示 search_files 工具的 content_regex（搜索文件内容中的模式）。
# 关键：tool_result 由真实工具执行产生。
# 数据完整性：text_delta 是通用 UI 文案。
#   - **不要**在 YAML 写匹配结果的具体行内容、文件路径、错误信息
id: search_content_regex
description: 用正则搜索文件内容（ERROR.*timeout）

keywords:
  - search_content_regex

rounds: 1

steps:
  - id: s1_start
    round_idx: 0
    delay_ms: 10
    events:
      - type: stream_start
        data: { scenario: search_content_regex }
      - type: text_delta
        # ✅ 通用 UI 文案（不含具体匹配结果）
        data: { text: "正在扫描日志文件，匹配指定正则模式…" }

  - id: s2_search
    round_idx: 0
    delay_ms: 30
    events:
      - type: tool_call
        data:
          id: call_scr_1
          name: search_files
          args:
            expression:
              and:
                - { type: content_regex, value: "ERROR.*timeout" }
                - { type: ext_eq,       value: ".log" }
            max_results: 50
          auto_run: true
          needsConfirm: false
          kind: fileSearch
          execute_real: true

  - id: s3_end
    round_idx: 0
    delay_ms: 50
    events:
      - type: text_delta
        data: { text: "搜索完成。详见上方工具结果中匹配的文件和行内容。" }
      - type: stream_end
        data: { finishReason: stop }
