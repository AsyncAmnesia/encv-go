id: search_content_regex
description: "用正则搜索文件内容"
keywords:
  - "search_content_regex"
rounds: 1

steps:
  - id: intro
    round_idx: 0
    delay_ms: 10
    events:
      - type: stream_start
        data: { scenario: search_content_regex }
      - type: text_delta
        data: { text: "正在扫描 .txt 文件内容…" }
  - id: search
    round_idx: 0
    delay_ms: 30
    events:
      - type: tool_call
        data:
          id: call_scr_1
          name: search_files
          args:
            expression:
              and:
                - type: content_regex
                  value: "test|sample|hello"
                - type: ext_eq
                  value: ".txt"
            max_results: 50
          auto_run: true
          needsConfirm: false
          kind: fileSearch
          execute_real: true
  - id: done
    round_idx: 0
    delay_ms: 50
    events:
      - type: text_delta
        data: { text: "内容搜索完成。匹配结果见上方工具返回。" }
      - type: stream_end
        data: { finishReason: stop }
