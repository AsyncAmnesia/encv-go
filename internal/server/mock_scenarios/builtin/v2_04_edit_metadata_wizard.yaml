id: edit_metadata_wizard
description: "4 轮元数据编辑向导（选文件→选字段→选值→确认）"
keywords:
  - "edit_metadata_wizard"
rounds: 4

presets:
  - id: wiz_start
    label: "开始编辑元数据"
    user_text: "开始"

steps:
  - id: round0_prompt
    round_idx: 0
    delay_ms: 10
    events:
      - type: text_delta
        data: { text: "请选择要编辑的文件：" }
  - id: round0_options
    round_idx: 0
    delay_ms: 10
    events:
      - type: mock_presets
        data:
          scenario: edit_metadata_wizard
          phase: select_file
          presets:
            - id: sel_a
              label: "选择文件 A"
              user_text: "选 a"
            - id: sel_b
              label: "选择文件 B"
              user_text: "选 b"
    pause_for_user: true

  - id: round1_prompt
    round_idx: 1
    delay_ms: 10
    events:
      - type: text_delta
        data: { text: "你想编辑哪个字段？" }
  - id: round1_options
    round_idx: 1
    delay_ms: 10
    events:
      - type: mock_presets
        data:
          scenario: edit_metadata_wizard
          phase: select_field
          presets:
            - id: f_title
              label: "title"
              user_text: "title"
            - id: f_year
              label: "year"
              user_text: "year"
            - id: f_genre
              label: "genre"
              user_text: "genre"
    pause_for_user: true

  - id: round2_prompt
    round_idx: 2
    delay_ms: 10
    events:
      - type: text_delta
        data: { text: "请选择新值：" }
  - id: round2_options
    round_idx: 2
    delay_ms: 10
    events:
      - type: mock_presets
        data:
          scenario: edit_metadata_wizard
          phase: select_value
          presets:
            - id: v_default
              label: "默认值"
              user_text: "默认"
            - id: v_custom
              label: "自定义"
              user_text: "自定义值"
    pause_for_user: true

  - id: round3_confirm
    round_idx: 3
    delay_ms: 10
    events:
      - type: text_delta
        data: { text: "即将执行元数据编辑操作。确认执行？" }
  - id: round3_execute
    round_idx: 3
    delay_ms: 30
    events:
      - type: tool_call
        data:
          id: call_emw_1
          name: edit_metadata
          args:
            ext: ".mp4"
            field: title
          auto_run: true
          needsConfirm: false
          kind: metadataEdit
          execute_real: true
  - id: round3_done
    round_idx: 3
    delay_ms: 50
    events:
      - type: text_delta
        data: { text: "元数据编辑完成。结果见上方工具返回。" }
      - type: stream_end
        data: { finishReason: stop }
