# batch_rename_with_preview — 批量重命名（dry_run 预览 → 确认 → 真实执行）
#
# 用途：演示 v2 多轮 + 写操作确认流程（dry_run → user 确认 → 真实执行）。
#
# 多轮机制：
#   - Round 0: dry_run 预览
#   - Round 1: 真实执行（用户 chip 确认后推进）
#
# 数据完整性：
#   - 不写具体文件路径（ep1.mkv → S01E01.mkv ❌）
#   - 不写 tool_result 事件（engine 自动产生）
#   - text_delta 是通用 UI 文案
#   - pattern 参数用占位（具体值由用户输入）
#
# 触发：关键词 batch_rename_with_preview
id: batch_rename_with_preview
description: 批量重命名（dry_run 预览 → 确认 → 真实执行）

keywords:
  - batch_rename_with_preview

rounds: 2

steps:
  # ── Round 0: dry_run 预览（推 mock_presets 列表等用户确认） ──
  - id: r0_start
    round_idx: 0
    delay_ms: 10
    events:
      - type: stream_start
        data: { scenario: batch_rename_with_preview }
      - type: text_delta
        data: { text: "正在预览批量重命名（dry_run）…" }

  - id: r0_dry_run
    round_idx: 0
    delay_ms: 30
    events:
      - type: tool_call
        data:
          id: call_br_1
          name: batch_rename
          # ✅ args 是过滤条件
          # pattern 由用户在前端输入（避免硬编码路径）
          args:
            pattern: "<USER_PATTERN>"
            source_glob: "*.mkv"
            dry_run: true
          auto_run: true
          needsConfirm: false
          kind: fileRename
          execute_real: true
      # 注意：tool_result 由 engine 自动产生，不写在此
      - type: text_delta
        # ✅ 通用 UI 文案（不写"2 个文件将重命名为..."）
        data: { text: "预览完成。详见上方工具结果中将要重命名的文件列表。" }
      - type: mock_presets
        data:
          scenario: batch_rename_with_preview
          phase: confirm
          presets:
            - id: ok
              label: "✓ 确认执行"
              user_text: "确认"
              icon: "✓"
            - id: no
              label: "✗ 取消"
              user_text: "取消"
              icon: "✗"

  # ── Round 1: 真实执行（用户 chip 确认后推进） ──
  - id: r1_execute
    round_idx: 1
    delay_ms: 10
    events:
      - type: text_delta
        data: { text: "执行批量重命名…" }

  - id: r1_real
    round_idx: 1
    delay_ms: 30
    events:
      - type: tool_call
        data:
          id: call_br_2
          name: batch_rename
          args:
            pattern: "<USER_PATTERN>"
            source_glob: "*.mkv"
            dry_run: false
          auto_run: true
          needsConfirm: true
          kind: fileRename
          execute_real: true

  - id: r1_end
    round_idx: 1
    delay_ms: 50
    events:
      - type: text_delta
        # ✅ 不写"已重命名 2 个文件" — 那是真实结果
        data: { text: "执行完成。详见上方工具结果。" }
      - type: stream_end
        data: { finishReason: stop }
