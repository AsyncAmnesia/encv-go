# branch_video_or_audio — 按文件类型分支：视频 / 音频 / 其他（v2 分支）
#
# 用途：演示 v2 分支（按用户选的文件类型走不同工具）。
#
# 分支机制：
#   - 3 个分支（video / audio / other）
#   - 第一个 step 标 BranchChoice: true → 推 mock_branch_choice
#   - 用户回复含 trigger_keywords → 推进对应分支
#
# 数据完整性：
#   - 不写具体文件路径 / 文件扩展名
#   - 不写 tool_result 事件
id: branch_video_or_audio
description: 按文件类型分支：视频 / 音频 / 其他

keywords:
  - branch_video_or_audio

rounds: 1

branches:
  - id: video
    label: "🎬 视频"
    description: "用 ffprobe 提取 codec/duration"
    icon: "🎬"
    trigger_keywords:
      - 视频
      - video
      - movie
    initial_step_id: video_action

  - id: audio
    label: "🎵 音频"
    description: "用 ffprobe 提取 bitrate/samplerate"
    icon: "🎵"
    trigger_keywords:
      - 音频
      - audio
    initial_step_id: audio_action

  - id: other
    label: "📄 其他"
    description: "读 sidecar 元数据"
    icon: "📄"
    trigger_keywords:
      - 其他
      - other
      - sidecar
    initial_step_id: other_action

steps:
  - id: choose_type
    round_idx: 0
    delay_ms: 10
    branch_id: choose_type
    branch_choice: true
    events:
      - type: stream_start
        data: { scenario: branch_video_or_audio }
      - type: text_delta
        data: { text: "请选择文件类型：" }

  # ── 分支目标 1：视频 → 调 command_run (ffprobe) ──
  - id: video_action
    round_idx: 0
    delay_ms: 10
    events:
      - type: text_delta
        data: { text: "好的，用 ffprobe 提取视频元数据…" }
      - type: tool_call
        data:
          id: call_bva_v
          name: command_run
          # ✅ args 是过滤条件（具体 path 由用户选的文件填入）
          args:
            cmd: "ffprobe"
            args:
              - "-v"
              - "quiet"
              - "-print_format"
              - "json"
              - "-show_format"
              - "-show_streams"
              - "<USER_SELECTED_FILE>"
          auto_run: true
          needsConfirm: false
          kind: shell
          execute_real: true
      - type: text_delta
        data: { text: "提取完成。详见上方工具结果中的元数据信息。" }
      - type: stream_end
        data: { finishReason: stop }

  # ── 分支目标 2：音频 → 同样 ffprobe ──
  - id: audio_action
    round_idx: 0
    delay_ms: 10
    events:
      - type: text_delta
        data: { text: "好的，用 ffprobe 提取音频元数据…" }
      - type: tool_call
        data:
          id: call_bva_a
          name: command_run
          args:
            cmd: "ffprobe"
            args:
              - "-v"
              - "quiet"
              - "-print_format"
              - "json"
              - "-show_format"
              - "<USER_SELECTED_FILE>"
          auto_run: true
          needsConfirm: false
          kind: shell
          execute_real: true
      - type: text_delta
        data: { text: "提取完成。详见上方工具结果中的元数据信息。" }
      - type: stream_end
        data: { finishReason: stop }

  # ── 分支目标 3：其他 → 调 get_metadata ──
  - id: other_action
    round_idx: 0
    delay_ms: 10
    events:
      - type: text_delta
        data: { text: "好的，读 sidecar 元数据…" }
      - type: tool_call
        data:
          id: call_bva_o
          name: get_metadata
          args: { path: "<USER_SELECTED_FILE>" }
          auto_run: true
          needsConfirm: false
          kind: readOnly
          execute_real: true
      - type: text_delta
        data: { text: "读取完成。详见上方工具结果中的元数据信息。" }
      - type: stream_end
        data: { finishReason: stop }
