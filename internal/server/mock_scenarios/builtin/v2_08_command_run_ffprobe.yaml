# command_run_ffprobe — command_run 受限 shell 输出（v2 单轮线性）
#
# 用途：演示 v2 command_run 工具的受限 shell 执行（ffprobe 探测视频元数据）。
#
# 沙箱机制：
#   - command_run 走受限 shell（白名单命令 + 沙箱根目录）
#   - 输出通过 SSE 流式推回前端
#   - YAML 不能 mock shell 输出（那是真实命令产生的）
#
# 数据完整性：
#   - 不写具体路径（Movies/a.mp4 ❌）
#   - 不写具体 codec 字段（codec=h264, duration=120s ❌）
#   - 不写 tool_result 事件
#   - text_delta 是通用 UI 文案
id: command_run_ffprobe
description: command_run 受限 shell 输出（ffprobe 探测视频元数据）

keywords:
  - command_run_ffprobe

rounds: 1

steps:
  - id: s1_start
    round_idx: 0
    delay_ms: 10
    events:
      - type: stream_start
        data: { scenario: command_run_ffprobe }
      - type: text_delta
        data: { text: "准备用 ffprobe 探测视频元数据…" }

  - id: s2_run
    round_idx: 0
    delay_ms: 30
    events:
      - type: tool_call
        data:
          id: call_crf_1
          name: command_run
          # ✅ args 是过滤条件
          # 具体 path 由用户在前端选文件后填入
          args:
            cmd: "ffprobe"
            args:
              - "-v"
              - "quiet"
              - "-print_format"
              - "json"
              - "-show_format"
              - "-show_streams"
              - "<USER_SELECTED_FILE>"
          auto_run: true
          needsConfirm: false
          kind: shell
          execute_real: true

  - id: s3_end
    round_idx: 0
    delay_ms: 50
    events:
      - type: text_delta
        data: { text: "探测完成。详见上方工具结果中的完整 ffprobe 输出。" }
      - type: stream_end
        data: { finishReason: stop }
